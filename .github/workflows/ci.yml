name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    name: Test, security, and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buildnix_test
          POSTGRES_USER: buildnix
          POSTGRES_PASSWORD: buildnix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildnix -d buildnix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests with race detector
        run: go test -race ./...

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://buildnix:buildnix@localhost:5432/buildnix_test?sslmode=disable
        run: go test ./internal/infra/database/postgres -run Integration -count=1 -v

      - name: Full test suite
        run: go test ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build binary
        run: go build -o bin/buildnix-backend-webapi ./cmd/webapi

      - name: Docker build
        run: docker build -t buildnix-backend:ci .
