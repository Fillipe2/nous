          type: integer
    LeadStatus:
      type: string
      description: |
        Funil padrao de leads:
        novo -> contatado -> qualificado -> negociacao -> proposta_enviada -> convertido | perdido.
      enum:
        - novo
        - contatado
        - qualificado
        - negociacao
        - proposta_enviada
        - convertido
        - perdido
    UTMInput:
      type: object
      description: Atribuicao de marketing capturada pela landing page.
      properties:
        source:
          type: string
          example: google
        medium:
          type: string
          example: cpc
        campaign:
          type: string
          example: lancamento_q2
        content:
          type: string
        term:
          type: string
    CapturarLeadInput:
      type: object
      required: [landingpage_id, nome, email, consentimento]
      description: |
        Payload publico enviado pelo formulario da landing page. O campo `website`
        e um honeypot anti-bot que deve permanecer vazio. O consentimento e
        obrigatorio para conformidade com a LGPD.
      properties:
        landingpage_id:
          type: string
        nome:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        telefone:
          type: string
          description: Aceita formato livre; sera normalizado para apenas digitos (com `+` opcional).
        whatsapp:
          type: string
        mensagem:
          type: string
          maxLength: 2000
        campos_personalizados:
          type: object
          description: Campos customizados configurados na landing page (limite ~8KB).
          additionalProperties: true
        consentimento:
          type: boolean
          description: Obrigatorio. Deve ser `true` para que o lead seja persistido (LGPD).
        politica_versao:
          type: string
          description: Versao da politica de privacidade aceita pelo titular.
          example: "2026-01-15"
        utm:
          $ref: '#/components/schemas/UTMInput'
        referrer:
          type: string
          description: Preenchido automaticamente pelo header `Referer` quando ausente.
        website:
          type: string
          description: Honeypot anti-spam. Deve ficar vazio; submissoes preenchidas sao descartadas silenciosamente.
    CapturarLeadOutput:
      type: object
      required: [id, mensagem]
      properties:
        id:
          type: string
        mensagem:
          type: string
          example: "Obrigado! Entraremos em contato em breve."
    LeadOutput:
      type: object
      required: [id, landingpage_id, nome, email, status, criado_em, consentimento]
      properties:
        id:
          type: string
        landingpage_id:
          type: string
        landingpage_nome:
          type: string
        cliente_id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        whatsapp:
          type: string
        mensagem:
          type: string
        campos_personalizados:
          type: object
          additionalProperties: true
        origem:
          type: string
          example: formulario_lp
        status:
          $ref: '#/components/schemas/LeadStatus'
        perdido_motivo:
          type: string
          description: Obrigatorio quando `status = perdido`.
        utm:
          $ref: '#/components/schemas/UTMInput'
        referrer:
          type: string
        consentimento:
          type: boolean
        consentimento_em:
          type: string
          format: date-time
        politica_versao:
          type: string
        anonimizado_em:
          type: string
          format: date-time
          description: Preenchido apos anonimizacao (LGPD); demais campos PII viram nulos.
        criado_em:
          type: string
          format: date-time
    ListaLeadsOutput:
      type: object
      required: [dados, total, pagina, por_pagina]
      properties:
        dados:
          type: array
