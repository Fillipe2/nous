openapi: 3.0.3
info:
  title: Buildnix Backend API
  version: 1.1.0
  description: |
    API REST do Buildnix: construção, gestão, autosave, exportação de landing pages,
    captura/gestão de leads e auditoria. O papel `admin` representa usuários internos
    da Sognix com visão operacional global.

    **Eventos / mensageria**: a publicação para o Observer é opcional. Quando
    `OBSERVER_URL` não está configurado, eventos como `lead.capturado` ficam apenas no
    outbox local. O Buildnix é totalmente funcional em modo standalone.

    **Convenções**:
    - Identificadores são UUID em string.
    - Datas em ISO-8601 (`format: date-time`); filtros `data_inicio`/`data_fim` em `YYYY-MM-DD`.
    - Erros sempre retornam `application/json` no formato `Erro` (`erro`, `codigo`, `mensagem`, `request_id`).
    - Endpoints autenticados usam `Authorization: Bearer <jwt>`.
servers:
  - url: /
    description: Servidor atual
tags:
  - name: Auth
    description: Login, refresh, logout, recuperação de senha e OAuth2 Google.
  - name: Usuarios
    description: Cadastro próprio, perfil autenticado e gestão administrativa.
  - name: Clientes
    description: Empresas/contas que detêm landing pages. Auto-vinculação na criação.
  - name: Dashboard
    description: Resumos operacionais (visão usuário ou admin).
  - name: Opcoes
    description: Listagens auxiliares para combos/filtros do frontend.
  - name: Negocios
    description: Negócios vinculados a um cliente (segmentação interna).
  - name: Categorias
    description: Categorias de templates e landing pages.
  - name: Templates
    description: Templates de origem Sognix ou subidos pelo cliente.
  - name: LandingPages
    description: CRUD, autosave com versionamento otimista, lock pessimista e exportação.
  - name: Leads
    description: |
      Captura pública (formulário da LP) e gestão restrita ao admin/Sognix.
      Dados pessoais são tratados como ativo comercial e ficam fora do dashboard
      do cliente comum. Inclui consentimento LGPD, UTMs e endpoints de anonimização.
  - name: Exportacoes
    description: Pacotes ZIP gerados a partir de landing pages.
  - name: LeadAquisicao
    description: |
      Captura pública de leads de aquisição B2B (Lead Tipo A — potenciais Operadores Sognix).
      Gestão de funil restrita ao admin/Sognix.
  - name: Auditoria
    description: Trilha imutável de operações sensíveis.
  - name: Sistema
    description: Healthcheck, especificação OpenAPI e JWKS.
paths:
  /.well-known/jwks.json:
    get:
      tags: [Sistema]
      summary: Chaves públicas para validação de tokens RS256
      description: |
        Retorna o conjunto de chaves públicas (JWKS) que permite ao novo backend
        validar tokens JWT emitidos pelo buildnix quando `JWT_RSA_PRIVATE_KEY` está
        configurado (RS256). Sem a chave RSA configurada, retorna 503.
      responses:
        '200':
          description: JWKS com chave pública RSA
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                          example: RSA
                        use:
                          type: string
                          example: sig
                        alg:
                          type: string
                          example: RS256
                        kid:
                          type: string
                        n:
                          type: string
                        e:
                          type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      tags: [Sistema]
      summary: Healthcheck da API
      description: |
        Retorna `{"status":"ok"}` se a aplicação subiu corretamente. Não verifica banco ou Redis — é um ping rápido usado por load balancers e readiness probes.
      responses:
        '200':
          description: API em execução
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /swagger:
    get:
      tags: [Sistema]
      summary: Exibe a interface Swagger UI para testar a API
      description: |
        Abre a documentação interativa da API. Use para explorar e testar endpoints sem precisar de cliente HTTP externo. Autenticação via botão **Authorize** (cole o `access_token` retornado pelo login).
      responses:
        '200':
          description: Página HTML do Swagger UI
          content:
            text/html:
              schema:
                type: string
  /swagger/openapi.yaml:
    get:
      tags: [Sistema]
      summary: Retorna a especificação OpenAPI embarcada
      description: |
        Retorna o arquivo `openapi.yaml` compilado dentro do binário. Útil para importar no Postman, Insomnia ou gerar SDKs de cliente.
      responses:
        '200':
          description: Especificação YAML
  /auth/login:
    post:
      tags: [Auth]
      summary: Login tradicional
      description: |
        Autentica com `email` + `senha` e retorna `access_token` (JWT de curta duração) e `refresh_token` (opaco, longa duração). O `access_token` deve ser enviado como `Authorization: Bearer <token>` em todas as requisições autenticadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova token JWT
      description: |
        Troca um `refresh_token` válido por um novo par `access_token` / `refresh_token`. O token antigo é imediatamente revogado (rotação). Use quando o `access_token` expirar (HTTP 401) antes de forçar o usuário a fazer login novamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout local do cliente
      description: |
        Revoga o `refresh_token` do cliente atual. O `access_token` não é invalidado (JWT stateless), mas expira naturalmente. Para logout em todos os dispositivos, revogue todos os tokens via gestão de usuário.
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
  /auth/esqueci-senha:
    post:
      tags: [Auth]
      summary: Solicita redefinição de senha
      description: |
        Sempre retorna mensagem genérica e aplica duração mínima para reduzir enumeração por resposta/timing. O token só é retornado quando RESET_PASSWORD_RETURN_TOKEN=true em ambiente local/teste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaInput'
      responses:
        '200':
          description: Solicitação registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsqueciSenhaOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/redefinir-senha:
    post:
      tags: [Auth]
      summary: Redefine senha com token de uso único
      description: Ao redefinir a senha, refresh tokens ativos do usuário são revogados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaInput'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/google/login:
    get:
      tags: [Auth]
      summary: Inicia login Google OAuth2 (abrir no navegador)
      description: |
        **Não use o "Try it out" do Swagger** para este endpoint. O fluxo OAuth depende
        de navegação top-level no navegador: a tentativa via `fetch()` segue o redirect
        para `accounts.google.com`, que não envia headers CORS para `localhost`, e o
        Swagger mostra "Failed to fetch".

        Como testar:
        1. Abra `GET /auth/google/login` em uma **aba nova** do navegador.
        2. Faça consentimento no Google.
        3. O Google redireciona para `/auth/google/callback`, que retorna `LoginOutput`
           (access/refresh tokens) em JSON.

        Cria cookie HttpOnly `oauth_state` (CSRF) e redireciona para o Google. Requer
        `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET` e `GOOGLE_REDIRECT_URL` configurados.
      responses:
        '307':
          description: Redirecionamento temporário para Google OAuth2
          headers:
            Location:
              description: URL de autorização do Google
              schema:
                type: string
            Set-Cookie:
              description: Cookie HttpOnly `oauth_state` usado para validação CSRF
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback do Google OAuth2 (chamado pelo navegador)
      description: |
        **Não invoque manualmente pelo Swagger.** Este endpoint é alvo do redirect do
        Google após o consentimento e exige o cookie `oauth_state` setado por
        `/auth/google/login` no mesmo navegador.

        Valida `state` contra o cookie `oauth_state`, troca `code` por token Google
        e retorna os tokens JWT do Buildnix.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Autenticado via Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /usuarios:
    post:
      tags: [Usuarios]
      summary: Cria usuário comum
      description: |
        Cria uma conta de usuário com papel `usuario`. Após criar, o usuário já pode fazer login via `POST /auth/login`. Para criar Operadores (clientes) use também `POST /clientes` após o login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUsuarioInput'
      responses:
        '201':
          description: Usuário criado
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Usuarios]
      summary: Lista usuários, admin
      description: |
        Lista todos os usuários do sistema. Exclusivo para `admin/Sognix`. Suporta filtros por nome, email, papel, status e período de criação, com paginação e ordenação.
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [usuario, admin]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          description: Data inicial inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          description: Data final inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, role, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de usuários
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Obtém o usuário autenticado
      description: |
        Retorna os dados do usuário dono do `access_token` atual (nome, email, papel, clientes vinculados). Usado pelo frontend para montar o perfil e decidir o que exibir conforme o papel.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios/me/senha:
    patch:
      tags: [Usuarios]
      summary: Altera a senha do usuário autenticado
      description: |
        Troca a senha do usuário logado. Exige a senha atual como confirmação. Após a troca, todos os `refresh_tokens` ativos são revogados — o usuário precisará fazer login novamente em outros dispositivos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaInput'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios/{id}:
    put:
      tags: [Usuarios]
      summary: Atualiza usuário
      description: |
        Atualiza nome, email ou papel de um usuário. Admin pode atualizar qualquer usuário; usuário comum só pode atualizar a si mesmo. Email duplicado retorna 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarUsuarioInput'
      responses:
        '200':
          description: Usuário atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Usuarios]
      summary: Exclui usuário com soft delete
      description: |
        Marca o usuário como excluído (soft delete). O registro é mantido no banco para auditoria. O usuário não consegue mais fazer login. Somente `admin` pode excluir outros usuários.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Usuário excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /clientes:
    get:
      tags: [Clientes]
      summary: Lista clientes, admin
      description: |
        Lista todos os clientes (Operadores) do sistema. Exclusivo para `admin/Sognix`. Filtre por usuário vinculado, nome, email, status e período. Cada cliente pode ter múltiplos usuários e múltiplas landing pages.
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de clientes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Clientes]
      summary: Cria cliente vinculado ao usuário autenticado
      description: |
        Cria um novo cliente (Operador/empresa) e o vincula automaticamente ao usuário autenticado. Um usuário pode estar vinculado a múltiplos clientes. Use `GET /clientes/me` para listar os clientes do usuário logado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarClienteInput'
      responses:
        '201':
          description: Cliente criado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /clientes/me:
    get:
      tags: [Clientes]
      summary: Lista clientes vinculados ao usuário autenticado
      description: |
        Retorna apenas os clientes aos quais o usuário autenticado tem acesso. Admin vê todos via `GET /clientes`. Use este endpoint no onboarding para permitir que o usuário escolha com qual cliente deseja trabalhar.
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista básica de clientes vinculados
        '401':
          $ref: '#/components/responses/Unauthorized'
  /clientes/{id}:
    put:
      tags: [Clientes]
      summary: Atualiza cliente, admin
      description: |
        Atualiza dados cadastrais do cliente (nome, email, plano, status). Exclusivo para `admin/Sognix`. Mudanças de plano refletem imediatamente nos limites de landing pages e funcionalidades do Operador.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarClienteInput'
      responses:
        '200':
          description: Cliente atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Clientes]
      summary: Exclui cliente com soft delete, admin
      description: |
        Marca o cliente como excluído (soft delete). Todos os dados são mantidos para auditoria. Landing pages, leads e exportações do cliente continuam acessíveis para o admin. Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Cliente excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard do usuário autenticado
      description: |
        Admin recebe métricas globais e pode recortar por cliente, usuário, landing page, negócio, categoria, template e tipo. Usuário comum recebe métricas agregadas dos clientes vinculados ao seu usuário; filtros não expõem dados pessoais de leads.
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: false
          description: Recorta métricas por cliente. Útil para o admin alternar entre visão global e cliente específico.
          schema:
            type: string
        - name: usuario_id
          in: query
          required: false
          description: Recorta métricas por usuário vinculado. Aplicável à visão admin.
          schema:
            type: string
        - name: landingpage_id
          in: query
          required: false
          description: Recorta métricas por landing page.
          schema:
            type: string
        - name: negocio_id
          in: query
          required: false
          description: Recorta métricas por negócio.
          schema:
            type: string
        - name: categoria_id
          in: query
          required: false
          description: Recorta métricas por categoria.
          schema:
            type: string
        - name: template_id
          in: query
          required: false
          description: Recorta métricas por template.
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          description: Recorta landing pages por tipo.
          schema:
            type: string
            enum: [white_label, customizavel]
        - name: data_inicio
          in: query
          description: Data inicial inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          description: Data final inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dashboard conforme o papel do usuário autenticado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DashboardUsuarioOutput'
                  - $ref: '#/components/schemas/DashboardAdminOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/clientes:
    get:
      tags: [Opcoes]
      summary: Lista opções de clientes para combos/filtros
      description: Admin/Sognix vê todos os clientes. Usuário comum vê apenas clientes vinculados ao seu usuário.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Busca por nome.
          schema:
            type: string
        - name: usuario_id
          in: query
          required: false
          description: Disponível para admin/Sognix filtrar clientes vinculados a um usuário.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
