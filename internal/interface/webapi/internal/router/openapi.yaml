          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /landingpages:
    get:
      tags: [LandingPages]
      summary: Lista landing pages
      description: |
        Lista landing pages com filtros por negocio, unidade, categoria, template, tipo e status. Admin vê todas; usuário comum vê apenas LPs dos negocios vinculados. Não retorna o campo `conteudo` (pesado) — use `GET /landingpages/{id}` para obter o conteúdo completo.
      security:
        - bearerAuth: []
      parameters:
        - name: negocio_id
          description: FK do Negócio dono. Filtra/escopo do recurso por Negócio.
          in: query
          required: false
          schema:
            type: string
        - name: unidade_id
          description: FK opcional da Unidade (sub-unidade do Negócio).
          in: query
          required: false
          schema:
            type: string
        - name: categoria_id
          description: FK da Categoria (vertical).
          in: query
          required: false
          schema:
            type: string
        - name: template_id
          description: FK do Template base.
          in: query
          required: false
          schema:
            type: string
        - name: nome
          description: Filtro parcial por nome (case-insensitive).
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          description: Filtra por tipo (depende do recurso; ver enums em /opcoes/enums).
          in: query
          required: false
          schema:
            type: string
            enum: [white_label, customizavel]
        - name: status
          description: 'Filtra por status do recurso (ex.: ativo, inativo).'
          in: query
          required: false
          schema:
            type: string
        - name: is_draft
          description: Quando true, retorna apenas rascunhos (não publicadas).
          in: query
          required: false
          schema:
            type: boolean
        - name: data_inicio
          description: Início do período de criação (YYYY-MM-DD).
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          description: Fim do período de criação (YYYY-MM-DD), inclusivo no dia inteiro.
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          description: 'Campo de ordenação (ex.: nome, criado_em).'
          in: query
          required: false
          schema:
            type: string
            enum: [nome, tipo, status, criado_em, atualizado_em, last_autosave_em]
            default: criado_em
        - name: ordem
          description: 'Direção da ordenação: asc ou desc (padrão desc).'
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de landing pages
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/LandingPageOutput'
                  total: { type: integer }
                  pagina: { type: integer }
                  por_pagina: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [LandingPages]
      summary: Cria landing page
      description: |
        Cria uma nova landing page vinculada a um negocio. Se `template_id` for informado, o conteúdo inicial é copiado do template. Se `slug` for omitido, é gerado automaticamente a partir do nome. O limite de LPs por negocio é definido pelo plano contratado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarLandingPageInput'
      responses:
        '201':
          description: Landing page criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /landingpages/{id}:
    get:
      tags: [LandingPages]
      summary: Obtém landing page
      description: |
        Retorna todos os campos da landing page, incluindo o `conteudo` (JSON do editor). Valida se o usuário tem acesso ao negocio dono da LP antes de retornar.
      security:
        - bearerAuth: []
