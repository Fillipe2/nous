openapi: 3.0.3
info:
  title: Buildnix Backend API
  version: 1.0.0
  description: API REST do Buildnix para criação, gestão, autosave, leads, exportação e auditoria de landing pages. O papel admin representa usuários internos da Sognix com visão operacional global.
servers:
  - url: /
tags:
  - name: Auth
  - name: Usuarios
  - name: Clientes
  - name: Dashboard
  - name: Opcoes
  - name: Negocios
  - name: Categorias
  - name: Templates
  - name: LandingPages
  - name: Leads
  - name: Exportacoes
  - name: Auditoria
  - name: Swagger
paths:
  /health:
    get:
      tags: [Swagger]
      summary: Healthcheck da API
      responses:
        '200':
          description: API em execução
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /swagger:
    get:
      tags: [Swagger]
      summary: Exibe a interface Swagger UI para testar a API
      responses:
        '200':
          description: Página HTML do Swagger UI
          content:
            text/html:
              schema:
                type: string
  /swagger/openapi.yaml:
    get:
      tags: [Swagger]
      summary: Retorna a especificação OpenAPI embarcada
      responses:
        '200':
          description: Especificação YAML
  /auth/login:
    post:
      tags: [Auth]
      summary: Login tradicional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout local do cliente
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
  /auth/google/login:
    get:
      tags: [Auth]
      summary: Inicia login Google OAuth2
      description: Cria cookie HttpOnly `oauth_state` e redireciona para o Google. Requer GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET e GOOGLE_REDIRECT_URL configurados.
      responses:
        '307':
          description: Redirecionamento temporário para Google OAuth2
          headers:
            Location:
              description: URL de autorização do Google
              schema:
                type: string
            Set-Cookie:
              description: Cookie HttpOnly `oauth_state` usado para validação CSRF
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback do Google OAuth2
      description: Valida `state` contra o cookie `oauth_state`, troca `code` por token Google e retorna os tokens JWT do Buildnix.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Autenticado via Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /usuarios:
    post:
      tags: [Usuarios]
      summary: Cria usuário comum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUsuarioInput'
      responses:
        '201':
          description: Usuário criado
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Usuarios]
      summary: Lista usuários, admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [usuario, admin]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, role, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de usuários
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Obtém o usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios/{id}:
    put:
      tags: [Usuarios]
      summary: Atualiza usuário
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarUsuarioInput'
      responses:
        '200':
          description: Usuário atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Usuarios]
      summary: Exclui usuário com soft delete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Usuário excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /clientes:
    get:
      tags: [Clientes]
      summary: Lista clientes, admin
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de clientes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Clientes]
      summary: Cria cliente, admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarClienteInput'
      responses:
        '201':
          description: Cliente criado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /clientes/me:
    get:
      tags: [Clientes]
      summary: Lista clientes vinculados ao usuário autenticado
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista básica de clientes vinculados
        '401':
          $ref: '#/components/responses/Unauthorized'
  /clientes/{id}:
    put:
      tags: [Clientes]
      summary: Atualiza cliente, admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarClienteInput'
      responses:
        '200':
          description: Cliente atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Clientes]
      summary: Exclui cliente com soft delete, admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Cliente excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usuarios-clientes:
    post:
      tags: [Clientes]
      summary: Vincula usuário a cliente, admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VincularUsuarioClienteInput'
      responses:
        '201':
          description: Usuário vinculado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard operacional do cliente
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: true
          schema:
            type: string
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Contadores do cliente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dashboard/admin:
    get:
      tags: [Dashboard]
      summary: Dashboard global da Sognix, admin
      description: Retorna métricas agregadas de clientes, usuários, templates, landing pages, leads e exportações.
      security:
        - bearerAuth: []
      parameters:
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Contadores globais da operação Sognix
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/clientes:
    get:
      tags: [Opcoes]
      summary: Lista opções de clientes para combos/filtros
      description: Admin/Sognix vê todos os clientes. Usuário comum vê apenas clientes vinculados ao seu usuário.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Busca por nome.
          schema:
            type: string
        - name: usuario_id
          in: query
          required: false
          description: Disponível para admin/Sognix filtrar clientes vinculados a um usuário.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /opcoes/usuarios:
    get:
      tags: [Opcoes]
      summary: Lista opções de usuários para combos/filtros, admin
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Busca por nome.
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [usuario, admin]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/negocios:
    get:
      tags: [Opcoes]
      summary: Lista opções de negócios para combos/filtros
      description: Admin/Sognix vê todos; usuário comum vê apenas negócios de clientes vinculados.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de negócios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/categorias:
    get:
      tags: [Opcoes]
      summary: Lista opções de categorias para combos/filtros
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de categorias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /opcoes/templates:
    get:
      tags: [Opcoes]
      summary: Lista opções de templates para combos/filtros
      description: Usuário comum deve informar cliente_id e recebe templates oficiais Sognix mais templates daquele cliente, respeitando o plano.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: categoria_id
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [white_label, base_customizavel]
        - name: origem
          in: query
          required: false
          schema:
            type: string
            enum: [sognix, cliente]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/landingpages:
    get:
      tags: [Opcoes]
      summary: Lista opções de landing pages para combos/filtros
      description: Admin/Sognix vê todas; usuário comum vê apenas landing pages de clientes vinculados.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: negocio_id
          in: query
          required: false
          schema:
            type: string
        - name: categoria_id
          in: query
          required: false
          schema:
            type: string
        - name: template_id
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [white_label, customizavel]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [rascunho, publicada, arquivada, excluida]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de landing pages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/enums:
    get:
      tags: [Opcoes]
      summary: Lista opções estáticas de tipos e status para combos/filtros
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Grupos de opções estáticas
        '401':
          $ref: '#/components/responses/Unauthorized'
  /negocios:
    get:
      tags: [Negocios]
      summary: Lista negócios visíveis ao usuário
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de negócios
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Negocios]
      summary: Cria negócio para cliente vinculado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarNegocioInput'
      responses:
        '201':
          description: Negócio criado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /negocios/{id}:
    put:
      tags: [Negocios]
      summary: Atualiza negócio do cliente vinculado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarNegocioInput'
      responses:
        '200':
          description: Negócio atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Negocios]
      summary: Exclui negócio com soft delete
      security:
