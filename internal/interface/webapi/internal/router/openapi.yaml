  /templates:
    get:
      tags: [Templates]
      summary: Lista templates
      description: |
        Lista templates disponíveis. Admin vê todos (Sognix + todos os clientes). Usuário comum filtra por `cliente_id` e vê templates oficiais Sognix + templates do cliente informado, respeitando o plano contratado. Suporta filtro por categoria, tipo e origem.
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: false
          description: Admin/Sognix pode filtrar templates de um cliente; usuário comum deve informar o cliente vinculado.
          schema:
            type: string
        - name: categoria_id
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [white_label, base_customizavel]
        - name: origem
          in: query
          required: false
          schema:
            type: string
            enum: [sognix, cliente]
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, tipo, origem, status, criado_em, atualizado_em]
            default: nome
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de templates
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Templates]
      summary: Cadastra template pronto no banco
      description: |
        Admin pode criar templates oficiais Sognix ou templates de cliente. Usuário comum só pode criar template do cliente ao qual tem acesso.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nome]
              properties:
                cliente_id:
                  type: string
                  description: Obrigatório quando origem=cliente.
                categoria_id:
                  type: string
                origem:
                  type: string
                  enum: [sognix, cliente]
                  default: sognix
                tipo:
                  type: string
                  enum: [white_label, base_customizavel]
                  default: white_label
                nome:
                  type: string
                conteudo:
                  type: string
                  description: Conteúdo do template salvo no banco. Pode substituir ou complementar o arquivo enviado.
                arquivo:
                  type: string
                  format: binary
                  description: Arquivo opcional; quando enviado e conteudo estiver vazio, seu conteúdo será salvo no banco.
      responses:
        '201':
          description: Template criado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /templates/{id}:
    delete:
      tags: [Templates]
      summary: Exclui template com soft delete, admin
      description: |
        Marca o template como excluído (soft delete). Landing pages que já usavam o template não são afetadas — elas mantêm o conteúdo copiado no momento da criação. Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Template excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /landingpages:
    get:
      tags: [LandingPages]
      summary: Lista landing pages
      description: |
        Lista landing pages com filtros por cliente, negócio, categoria, template, tipo e status. Admin vê todas; usuário comum vê apenas LPs dos clientes vinculados. Não retorna o campo `conteudo` (pesado) — use `GET /landingpages/{id}` para obter o conteúdo completo.
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: negocio_id
          in: query
          required: false
          schema:
            type: string
        - name: categoria_id
          in: query
          required: false
          schema:
            type: string
        - name: template_id
          in: query
          required: false
          schema:
            type: string
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [white_label, customizavel]
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: is_draft
          in: query
          required: false
          schema:
            type: boolean
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, tipo, status, criado_em, atualizado_em, last_autosave_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de landing pages
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [LandingPages]
      summary: Cria landing page
      description: |
        Cria uma nova landing page vinculada a um cliente. Se `template_id` for informado, o conteúdo inicial é copiado do template. Se `slug` for omitido, é gerado automaticamente a partir do nome. O limite de LPs por cliente é definido pelo plano contratado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarLandingPageInput'
      responses:
        '201':
          description: Landing page criada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /landingpages/{id}:
    get:
      tags: [LandingPages]
      summary: Obtém landing page
      description: |
        Retorna todos os campos da landing page, incluindo o `conteudo` (JSON do editor). Valida se o usuário tem acesso ao cliente dono da LP antes de retornar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Landing page
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [LandingPages]
      summary: Atualiza landing page
      description: |
        Atualiza metadados e conteúdo da landing page via PUT completo. Usa controle de versão otimista: envie o `version` atual — se houver conflito (outro usuário salvou antes), retorna 409. Para salvar rascunhos frequentemente, prefira `PATCH /landingpages/{id}/autosave`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarLandingPageInput'
      responses:
        '200':
          description: Landing page atualizada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [LandingPages]
      summary: Exclui landing page com soft delete
      description: |
        Marca a landing page como excluída (soft delete). Se a LP estiver publicada, é despublicada automaticamente antes da exclusão. Leads e exportações vinculadas são mantidos para auditoria.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Landing page excluída
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /landingpages/{id}/autosave:
    patch:
      tags: [LandingPages]
      summary: Salva rascunho automático da landing page
      description: |
        Endpoint de autosave para o editor. Aceita incrementos frequentes sem exigir o objeto completo. Usa controle de versão otimista (`version`) para evitar sobrescrita silenciosa. Retorna a nova versão após salvar — o frontend deve atualizar o `version` local com o valor retornado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutosaveInput'
      responses:
        '200':
          description: Autosave atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /landingpages/{id}/lock:
    patch:
      tags: [LandingPages]
      summary: Bloqueia landing page para edição concorrente
      description: |
        Cria um lock pessimista de 5 minutos para a LP, identificando o editor pelo `usuario_id`. Enquanto o lock estiver ativo, outros usuários recebem 409 ao tentar editar. O frontend deve renovar o lock antes de expirar chamando este endpoint novamente.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lock criado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /landingpages/{id}/unlock:
    patch:
      tags: [LandingPages]
      summary: Remove lock de edição da landing page
      description: |
        Libera o lock pessimista da LP. Deve ser chamado quando o usuário sair da tela de edição (beforeunload). Se o lock já expirou ou pertence a outro usuário, retorna sucesso silencioso.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lock removido
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landingpages/{id}/exportar:
    post:
      tags: [LandingPages, Exportacoes]
      summary: Envia ZIP exportado da landing page
      description: |
        Upload multipart do ZIP gerado pelo frontend para a landing page. O arquivo é validado como ZIP e fica disponível para download em /exportacoes/{id}/download.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Exportação salva
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /landingpages/{id}/publicar:
    post:
      tags: [LandingPages]
      summary: Publica a landing page no hosting estático
      description: |
        Busca a exportação ZIP mais recente da landing page, extrai os arquivos e
        faz deploy via adaptador de hosting configurado. Armazena `url_publica`,
        `deploy_id` e `publicada_em` na LP. Publica evento `landingpage.publicada`
        no outbox quando `OBSERVER_URL` estiver configurado.

        Pré-requisitos:
        - A LP deve ter um `slug` definido.
        - Deve existir ao menos uma exportação ZIP para a LP.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Landing page publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicarLandingPageOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Slug não definido ou sem exportação disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /landingpages/{id}/despublicar:
    post:
      tags: [LandingPages]
      summary: Despublica a landing page
      description: |
        Chama o adaptador de hosting para remover o deploy e atualiza o status
        da LP para `rascunho`, limpando `url_publica` e `deploy_id`.
        Retorna 422 se a LP não estiver publicada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Landing page despublicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Landing page não está publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /leads:
    post:
      tags: [Leads]
      summary: Captura lead pelo formulário público da LP
      description: |
        Endpoint público (sem autenticação) chamado pelo formulário da landing page.

        Validações aplicadas:
        - `landingpage_id` deve existir e estar **publicada**.
        - `consentimento` deve ser `true` (LGPD).
        - `email` é normalizado (lowercase + trim) e validado.
        - `telefone` ou `whatsapp` é obrigatório (apenas dígitos após normalização).
        - `mensagem` ≤ 2000 caracteres; `campos_personalizados` ≤ 8KB.
        - Honeypot: o campo `website` deve vir vazio; submissões com ele preenchido
          são descartadas silenciosamente (resposta 201 neutra).
        - Dedupe: mesmo `email` + `landingpage_id` em janela de 5 min retorna o
          lead anterior sem republicar evento.

        Quando `OBSERVER_URL` está configurado, um evento `lead.capturado` é
        publicado no outbox para envio ao Observer/Sbrain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturarLeadInput'
      responses:
        '201':
          description: Lead capturado (ou descartado silenciosamente em caso de honeypot)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturarLeadOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Landing page inexistente ou não publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      tags: [Leads]
      summary: Lista leads (admin/Sognix)
      description: |
        Usuário comum não acessa dados pessoais de leads. Admin pode filtrar por cliente, landing page, status, UTM e período.
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          schema:
            type: string
        - name: landingpage_id
          in: query
          schema:
            type: string
        - name: nome
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/LeadStatus'
        - name: utm_source
          in: query
          schema:
            type: string
        - name: utm_campaign
          in: query
          schema:
            type: string
        - name: data_inicio
          in: query
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          schema:
            type: string
            enum: [nome, email, status, criado_em]
            default: criado_em
        - name: ordem
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista paginada de leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaLeadsOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /leads/{id}:
    get:
      tags: [Leads]
      summary: Obtém detalhes do lead (admin/Sognix)
      description: |
        Retorna todos os campos do lead, incluindo dados PII (nome, email, telefone, WhatsApp), UTMs e consentimento LGPD. Exclusivo para `admin/Sognix`. Leads anonimizados retornam os campos PII como `null`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lead encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /leads/{id}/status:
    patch:
      tags: [Leads]
      summary: Atualiza status do lead (admin/Sognix)
      description: |
        Move o lead pelo funil de vendas. Quando `status = perdido`, o campo
        `motivo` passa a ser obrigatório.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarStatusLeadInput'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /leads/{id}/anonimizar:
    post:
      tags: [Leads]
      summary: Anonimiza um lead (admin/Sognix)
      description: |
        Remove dados pessoais (PII) do lead, mantendo o registro para auditoria.
        Operação idempotente do ponto de vista de PII; retorna 409 se o lead já
        estava anonimizado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lead anonimizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /leads/anonimizar-expirados:
    post:
      tags: [Leads]
      summary: Anonimiza leads expirados em lote (admin/Sognix)
      description: |
        Aplica a retenção LGPD: anonimiza leads cujo `criado_em` é anterior a
        `agora - dias` e que não estão em status `convertido`.
        Sem o parâmetro, usa o padrão de **365 dias**.
      security:
        - bearerAuth: []
      parameters:
        - name: dias
          in: query
          description: Janela de retenção em dias. Padrão 365.
          schema:
            type: integer
            minimum: 1
            default: 365
      responses:
        '200':
          description: Total de leads anonimizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  anonimizados:
                    type: integer
                    example: 27
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /lead_aquisicao:
    post:
      tags: [LeadAquisicao]
      summary: Registra lead de aquisição B2B (formulário público de aquisição Sognix)
      description: |
        Endpoint público (sem autenticação) chamado pelo formulário de aquisição da Sognix.
        Captura dados de potenciais Operadores (Lead Tipo A) interessados em contratar produtos Sognix.

        Validações:
        - `nome` e `email` são obrigatórios.
        - `email` é normalizado e deve ser único (409 em duplicata).
        - `porte` aceita: `micro`, `pequeno`, `medio`, `grande` ou vazio.
        - `mensagem` ≤ 2000 caracteres.
        - Honeypot: o campo `website` deve ficar vazio; preenchido, a submissão é descartada silenciosamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarLeadAquisicaoInput'
      responses:
        '201':
          description: Lead registrado (ou descartado silenciosamente em caso de honeypot)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  mensagem:
                    type: string
                    example: "Obrigado! Entraremos em contato em breve."
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      tags: [LeadAquisicao]
      summary: Lista leads de aquisição B2B (admin/Sognix)
      description: |
        Lista leads de aquisição (potenciais Operadores Sognix) com filtros por nome, email, status de funil, porte, localização, UTM e período. Exclusivo para `admin/Sognix`. Suporta paginação e ordenação.
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status_funil
          in: query
          required: false
          schema:
            type: string
            enum: [novo, contatado, qualificado, negociacao, convertido, perdido]
        - name: porte
          in: query
          required: false
          schema:
            type: string
            enum: [micro, pequeno, medio, grande]
        - name: cidade
          in: query
          required: false
          schema:
            type: string
        - name: estado
          in: query
          required: false
          schema:
            type: string
        - name: utm_campaign
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status_funil, criado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de leads de aquisição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaLeadsAquisicaoOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /lead_aquisicao/{id}:
    get:
      tags: [LeadAquisicao]
      summary: Obtém lead de aquisição B2B (admin/Sognix)
      description: |
        Retorna todos os campos do lead de aquisição, incluindo dados de contato, perfil da empresa (porte, categoria pretendida, cidade, estado) e posição no funil comercial. Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lead de aquisição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAquisicaoOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /lead_aquisicao/{id}/funil:
    patch:
      tags: [LeadAquisicao]
      summary: Atualiza status do funil do lead de aquisição (admin/Sognix)
      description: |
        Avança ou retrocede o lead no funil comercial Sognix (`novo → contatado → qualificado → negociacao → convertido | perdido`). Quando `status_funil=convertido`, informe `convertido_em_usuario_id` com o UUID do usuário criado para o Operador. Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarFunilLeadAquisicaoInput'
      responses:
        '200':
          description: Funil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /exportacoes:
    get:
      tags: [Exportacoes]
      summary: Lista exportações, admin/Sognix global ou por landing page
      description: |
        Lista exportações (pacotes ZIP) geradas a partir de landing pages. Admin vê todas ou pode filtrar por cliente/LP. Usuário comum deve informar `landingpage_id` de uma LP à qual tem acesso. Use `GET /exportacoes/{id}/download` para baixar o arquivo.
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: false
          description: Filtro global disponível para admin/Sognix.
          schema:
            type: string
        - name: landingpage_id
          in: query
          required: false
          description: Obrigatório para usuário comum; opcional para admin/Sognix.
          schema:
            type: string
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: nome_arquivo
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome_arquivo, tamanho_bytes, criado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de exportações
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /exportacoes/{id}/download:
    get:
      tags: [Exportacoes]
      summary: Baixa ZIP gerado
      description: |
        Faz o download do arquivo ZIP de uma exportação. O ZIP contém os arquivos estáticos gerados pelo editor (HTML, CSS, JS, assets) prontos para deploy. A exportação deve pertencer a uma LP à qual o usuário tem acesso.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Arquivo ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auditoria:
    get:
      tags: [Auditoria]
      summary: Lista auditoria, admin
      description: |
        Lista eventos de auditoria registrados automaticamente pelo middleware para operações sensíveis (criação, atualização, exclusão, login, etc.). Exclusivo para `admin/Sognix`. Filtre por usuário, cliente, entidade, ação e período. Registros são imutáveis.
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: acao
          in: query
          required: false
          schema:
            type: string
        - name: entidade
          in: query
          required: false
          schema:
            type: string
        - name: entidade_id
          in: query
          required: false
          schema:
            type: string
        - name: status_code
          in: query
          required: false
          schema:
            type: integer
        - name: request_id
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [acao, entidade, status_code, tempo_resposta_ms, criado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de auditoria
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auditoria/{id}:
    get:
      tags: [Auditoria]
      summary: Obtém evento de auditoria, admin
      description: |
        Retorna os detalhes completos de um evento de auditoria: quem fez (`usuario_id`), o quê (`entidade` + `entidade_id`), quando (`criado_em`), de onde (`ip`, `user_agent`) e o payload de mudança (`metadados`). Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Auditoria
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PorPagina:
      name: por_pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflict:
      description: Conflito de versão ou lock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ServiceUnavailable:
      description: Serviço externo ou integração não configurada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
        codigo:
          type: string
        mensagem:
          type: string
        request_id:
          type: string
    MensagemOutput:
      type: object
      properties:
        mensagem:
          type: string
    LandingPageUtilizadaOutput:
