components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PorPagina:
      name: por_pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflict:
      description: Conflito de versão ou lock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ServiceUnavailable:
      description: Serviço externo ou integração não configurada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
        codigo:
          type: string
        mensagem:
          type: string
        request_id:
          type: string
    MensagemOutput:
      type: object
      properties:
        mensagem:
          type: string
    OpcaoOutput:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        label:
          type: string
        status:
          type: string
        tipo:
          type: string
        origem:
          type: string
        cliente_id:
          type: string
        categoria_id:
          type: string
    ListaOpcoesOutput:
      type: object
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/OpcaoOutput'
        total:
          type: integer
        pagina:
          type: integer
        por_pagina:
          type: integer
    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LoginOutput:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
        usuario:
          type: object
        clientes:
          type: array
          items:
            type: object
    CriarUsuarioInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
        role:
          type: string
          enum: [usuario, admin]
    AtualizarUsuarioInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
        version:
          type: integer
    CriarClienteInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
    AtualizarClienteInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        version:
          type: integer
    VincularUsuarioClienteInput:
      type: object
