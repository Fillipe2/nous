    get:
      tags: [Exportacoes]
      summary: Lista exportações, admin/Sognix global ou por landing page
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: false
          description: Filtro global disponível para admin/Sognix.
          schema:
            type: string
        - name: landingpage_id
          in: query
          required: false
          description: Obrigatório para usuário comum; opcional para admin/Sognix.
          schema:
            type: string
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: nome_arquivo
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome_arquivo, tamanho_bytes, criado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de exportações
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /exportacoes/{id}/download:
    get:
      tags: [Exportacoes]
      summary: Baixa ZIP gerado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Arquivo ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auditoria:
    get:
      tags: [Auditoria]
      summary: Lista auditoria, admin
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: acao
          in: query
          required: false
          schema:
            type: string
        - name: entidade
          in: query
          required: false
          schema:
            type: string
        - name: entidade_id
          in: query
          required: false
          schema:
            type: string
        - name: status_code
          in: query
          required: false
          schema:
            type: integer
        - name: request_id
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [acao, entidade, status_code, tempo_resposta_ms, criado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de auditoria
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auditoria/{id}:
    get:
      tags: [Auditoria]
      summary: Obtém evento de auditoria, admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Auditoria
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PorPagina:
      name: por_pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflict:
      description: Conflito de versão ou lock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ServiceUnavailable:
      description: Serviço externo ou integração não configurada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
        codigo:
          type: string
        mensagem:
          type: string
        request_id:
          type: string
    MensagemOutput:
      type: object
      properties:
        mensagem:
          type: string
    LandingPageUtilizadaOutput:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        total_exportacoes:
          type: integer
    DashboardUsuarioOutput:
      type: object
      properties:
        usuario_id:
          type: string
        clientes_vinculados:
          type: integer
        landingpages_criadas:
          type: integer
        landingpages_online:
          type: integer
        exportacoes_geradas:
          type: integer
        landingpage_mais_usada:
          $ref: '#/components/schemas/LandingPageUtilizadaOutput'
    DashboardAdminOutput:
      type: object
      properties:
        clientes_ativos:
          type: integer
        usuarios_ativos:
          type: integer
        templates_sognix:
          type: integer
        templates_clientes:
          type: integer
        landingpages_criadas:
          type: integer
        landingpages_online:
          type: integer
        leads_capturados:
          type: integer
        exportacoes_geradas:
          type: integer
        clientes_com_plano_customizavel:
          type: integer
    OpcaoOutput:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        label:
          type: string
        status:
          type: string
        tipo:
          type: string
        origem:
          type: string
        cliente_id:
          type: string
        categoria_id:
          type: string
    ListaOpcoesOutput:
      type: object
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/OpcaoOutput'
        total:
          type: integer
        pagina:
          type: integer
        por_pagina:
          type: integer
    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LoginOutput:
      type: object
      properties:
        token:
          type: string
        refresh_token:
          type: string
        usuario:
          type: object
        clientes:
          type: array
          items:
            type: object
    CriarUsuarioInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
        role:
          type: string
          enum: [usuario, admin]
    AtualizarUsuarioInput:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
    AlterarSenhaInput:
      type: object
      required: [senha_atual, nova_senha]
      properties:
        senha_atual:
          type: string
          format: password
        nova_senha:
          type: string
          format: password
    EsqueciSenhaInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    EsqueciSenhaOutput:
      type: object
      required: [mensagem]
      properties:
        mensagem:
          type: string
        reset_token:
          type: string
          description: Retornado apenas quando RESET_PASSWORD_RETURN_TOKEN=true.
    RedefinirSenhaInput:
      type: object
      required: [token, nova_senha]
      properties:
        token:
          type: string
        nova_senha:
          type: string
          format: password
    CriarClienteInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        whatsapp:
          type: string
    AtualizarClienteInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        whatsapp:
          type: string
        version:
          type: integer
    CriarNegocioInput:
      type: object
      required: [cliente_id, nome]
      properties:
        cliente_id:
          type: string
        nome:
          type: string
    AtualizarNegocioInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        version:
          type: integer
    CriarCategoriaInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
    AtualizarCategoriaInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        version:
          type: integer
    CriarLandingPageInput:
      type: object
      required: [cliente_id, nome]
      properties:
        cliente_id:
          type: string
        negocio_id:
          type: string
        categoria_id:
          type: string
        template_id:
          type: string
        tipo:
          type: string
          enum: [white_label, customizavel]
          default: white_label
        nome:
          type: string
        conteudo:
          type: string
          description: Permitido para landing pages customizáveis. White label parte do conteúdo do template.
    AtualizarLandingPageInput:
      type: object
      required: [version]
      properties:
        negocio_id:
          type: string
        categoria_id:
          type: string
        template_id:
          type: string
        tipo:
          type: string
          enum: [white_label, customizavel]
        nome:
          type: string
        conteudo:
          type: string
        status:
          type: string
        version:
          type: integer
    AutosaveInput:
      type: object
      required: [autosave_data, version]
      properties:
        autosave_data:
          type: object
          additionalProperties: true
        version:
          type: integer
    LeadStatus:
      type: string
      description: |
        Funil padrao de leads:
        novo -> contatado -> qualificado -> negociacao -> proposta_enviada -> convertido | perdido.
      enum:
        - novo
        - contatado
        - qualificado
        - negociacao
        - proposta_enviada
        - convertido
        - perdido
    UTMInput:
      type: object
      description: Atribuicao de marketing capturada pela landing page.
      properties:
        source:
          type: string
          example: google
        medium:
          type: string
          example: cpc
        campaign:
          type: string
          example: lancamento_q2
        content:
          type: string
        term:
          type: string
    CapturarLeadInput:
      type: object
      required: [landingpage_id, nome, email, consentimento]
      description: |
        Payload publico enviado pelo formulario da landing page. O campo `website`
        e um honeypot anti-bot que deve permanecer vazio. O consentimento e
        obrigatorio para conformidade com a LGPD.
      properties:
        landingpage_id:
          type: string
        nome:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        telefone:
          type: string
          description: Aceita formato livre; sera normalizado para apenas digitos (com `+` opcional).
        whatsapp:
          type: string
        mensagem:
          type: string
          maxLength: 2000
        campos_personalizados:
          type: object
          description: Campos customizados configurados na landing page (limite ~8KB).
          additionalProperties: true
        consentimento:
          type: boolean
          description: Obrigatorio. Deve ser `true` para que o lead seja persistido (LGPD).
        politica_versao:
          type: string
          description: Versao da politica de privacidade aceita pelo titular.
          example: "2026-01-15"
        utm:
          $ref: '#/components/schemas/UTMInput'
        referrer:
          type: string
          description: Preenchido automaticamente pelo header `Referer` quando ausente.
        website:
          type: string
          description: Honeypot anti-spam. Deve ficar vazio; submissoes preenchidas sao descartadas silenciosamente.
    CapturarLeadOutput:
      type: object
      required: [id, mensagem]
      properties:
        id:
          type: string
        mensagem:
          type: string
          example: "Obrigado! Entraremos em contato em breve."
    LeadOutput:
      type: object
      required: [id, landingpage_id, nome, email, status, criado_em, consentimento]
      properties:
        id:
          type: string
        landingpage_id:
          type: string
        landingpage_nome:
          type: string
        cliente_id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        whatsapp:
          type: string
        mensagem:
          type: string
        campos_personalizados:
          type: object
          additionalProperties: true
        origem:
          type: string
          example: formulario_lp
        status:
          $ref: '#/components/schemas/LeadStatus'
        perdido_motivo:
          type: string
          description: Obrigatorio quando `status = perdido`.
        utm:
          $ref: '#/components/schemas/UTMInput'
        referrer:
          type: string
        consentimento:
          type: boolean
        consentimento_em:
          type: string
          format: date-time
        politica_versao:
          type: string
        anonimizado_em:
          type: string
          format: date-time
          description: Preenchido apos anonimizacao (LGPD); demais campos PII viram nulos.
        criado_em:
          type: string
          format: date-time
    ListaLeadsOutput:
      type: object
      required: [dados, total, pagina, por_pagina]
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/LeadOutput'
        total:
          type: integer
        pagina:
          type: integer
        por_pagina:
          type: integer
    AtualizarStatusLeadInput:
      type: object
      required: [status]
      description: |
        Atualiza o status no funil. Quando `status = perdido`, `motivo` torna-se obrigatorio.
      properties:
        status:
          $ref: '#/components/schemas/LeadStatus'
        motivo:
          type: string
          maxLength: 500
          description: Obrigatorio quando `status = perdido`. Texto livre para registrar a razao.
