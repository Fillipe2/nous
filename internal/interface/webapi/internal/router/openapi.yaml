openapi: 3.0.3
info:
  title: Buildnix Backend API
  version: 1.1.0
  description: |
    API REST do Buildnix: construção, gestão, autosave, exportação de landing pages,
    captura/gestão de leads e auditoria. O papel `admin` representa usuários internos
    da Sognix com visão operacional global.

    **Eventos / mensageria**: a publicação para o Observer é opcional. Quando
    `OBSERVER_URL` não está configurado, eventos como `lead.capturado` ficam apenas no
    outbox local. O Buildnix é totalmente funcional em modo standalone.

    **Convenções**:
    - Identificadores são UUID em string.
    - Datas em ISO-8601 (`format: date-time`); filtros `data_inicio`/`data_fim` em `YYYY-MM-DD`.
    - Erros sempre retornam `application/json` no formato `Erro` (`erro`, `codigo`, `mensagem`, `request_id`).
    - Endpoints autenticados usam `Authorization: Bearer <jwt>`.
servers:
  - url: /
    description: Servidor atual
tags:
  - name: Auth
    description: Login, refresh, logout, recuperação de senha e OAuth2 Google.
  - name: Usuarios
    description: Cadastro próprio, perfil autenticado e gestão administrativa.
  - name: Clientes
    description: Empresas/contas que detêm landing pages. Auto-vinculação na criação.
  - name: Dashboard
    description: Resumos operacionais (visão usuário ou admin).
  - name: Opcoes
    description: Listagens auxiliares para combos/filtros do frontend.
  - name: Negocios
    description: Negócios vinculados a um cliente (segmentação interna).
  - name: Categorias
    description: Categorias de templates e landing pages.
  - name: Templates
    description: Templates de origem Sognix ou subidos pelo cliente.
  - name: LandingPages
    description: CRUD, autosave com versionamento otimista, lock pessimista e exportação.
  - name: Leads
    description: |
      Captura pública (formulário da LP) e gestão restrita ao admin/Sognix.
      Dados pessoais são tratados como ativo comercial e ficam fora do dashboard
      do cliente comum. Inclui consentimento LGPD, UTMs e endpoints de anonimização.
  - name: Exportacoes
    description: Pacotes ZIP gerados a partir de landing pages.
  - name: Auditoria
    description: Trilha imutável de operações sensíveis.
  - name: Sistema
    description: Healthcheck e especificação OpenAPI.
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Healthcheck da API
      responses:
        '200':
          description: API em execução
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /swagger:
    get:
      tags: [Sistema]
      summary: Exibe a interface Swagger UI para testar a API
      responses:
        '200':
          description: Página HTML do Swagger UI
          content:
            text/html:
              schema:
                type: string
  /swagger/openapi.yaml:
    get:
      tags: [Sistema]
      summary: Retorna a especificação OpenAPI embarcada
      responses:
        '200':
          description: Especificação YAML
  /auth/login:
    post:
      tags: [Auth]
      summary: Login tradicional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout local do cliente
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
  /auth/esqueci-senha:
    post:
      tags: [Auth]
      summary: Solicita redefinição de senha
      description: Sempre retorna mensagem genérica e aplica duração mínima para reduzir enumeração por resposta/timing. O token só é retornado quando RESET_PASSWORD_RETURN_TOKEN=true em ambiente local/teste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaInput'
      responses:
        '200':
          description: Solicitação registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsqueciSenhaOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/redefinir-senha:
    post:
      tags: [Auth]
      summary: Redefine senha com token de uso único
      description: Ao redefinir a senha, refresh tokens ativos do usuário são revogados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaInput'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/google/login:
    get:
      tags: [Auth]
      summary: Inicia login Google OAuth2 (abrir no navegador)
      description: |
        **Não use o "Try it out" do Swagger** para este endpoint. O fluxo OAuth depende
        de navegação top-level no navegador: a tentativa via `fetch()` segue o redirect
        para `accounts.google.com`, que não envia headers CORS para `localhost`, e o
        Swagger mostra "Failed to fetch".

        Como testar:
        1. Abra `GET /auth/google/login` em uma **aba nova** do navegador.
        2. Faça consentimento no Google.
        3. O Google redireciona para `/auth/google/callback`, que retorna `LoginOutput`
           (access/refresh tokens) em JSON.

        Cria cookie HttpOnly `oauth_state` (CSRF) e redireciona para o Google. Requer
        `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET` e `GOOGLE_REDIRECT_URL` configurados.
      responses:
        '307':
          description: Redirecionamento temporário para Google OAuth2
          headers:
            Location:
              description: URL de autorização do Google
              schema:
                type: string
            Set-Cookie:
              description: Cookie HttpOnly `oauth_state` usado para validação CSRF
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback do Google OAuth2 (chamado pelo navegador)
      description: |
        **Não invoque manualmente pelo Swagger.** Este endpoint é alvo do redirect do
        Google após o consentimento e exige o cookie `oauth_state` setado por
        `/auth/google/login` no mesmo navegador.

        Valida `state` contra o cookie `oauth_state`, troca `code` por token Google
        e retorna os tokens JWT do Buildnix.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Autenticado via Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /usuarios:
    post:
      tags: [Usuarios]
      summary: Cria usuário comum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUsuarioInput'
      responses:
        '201':
          description: Usuário criado
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Usuarios]
      summary: Lista usuários, admin
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [usuario, admin]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          description: Data inicial inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          description: Data final inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, role, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de usuários
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Obtém o usuário autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios/me/senha:
    patch:
      tags: [Usuarios]
      summary: Altera a senha do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaInput'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios/{id}:
    put:
      tags: [Usuarios]
      summary: Atualiza usuário
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarUsuarioInput'
      responses:
        '200':
          description: Usuário atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Usuarios]
      summary: Exclui usuário com soft delete
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Usuário excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /clientes:
    get:
      tags: [Clientes]
      summary: Lista clientes, admin
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          in: query
          required: false
          schema:
            type: string
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de clientes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Clientes]
      summary: Cria cliente vinculado ao usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarClienteInput'
      responses:
        '201':
          description: Cliente criado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /clientes/me:
    get:
      tags: [Clientes]
      summary: Lista clientes vinculados ao usuário autenticado
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          in: query
          required: false
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista básica de clientes vinculados
        '401':
          $ref: '#/components/responses/Unauthorized'
  /clientes/{id}:
    put:
      tags: [Clientes]
      summary: Atualiza cliente, admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarClienteInput'
      responses:
        '200':
          description: Cliente atualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Clientes]
      summary: Exclui cliente com soft delete, admin
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Cliente excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard do usuário autenticado
      description: Admin recebe métricas globais e pode recortar por cliente, usuário, landing page, negócio, categoria, template e tipo. Usuário comum recebe métricas agregadas dos clientes vinculados ao seu usuário; filtros não expõem dados pessoais de leads.
      security:
        - bearerAuth: []
      parameters:
        - name: cliente_id
          in: query
          required: false
          description: Recorta métricas por cliente. Útil para o admin alternar entre visão global e cliente específico.
          schema:
            type: string
        - name: usuario_id
          in: query
          required: false
          description: Recorta métricas por usuário vinculado. Aplicável à visão admin.
          schema:
            type: string
        - name: landingpage_id
          in: query
          required: false
          description: Recorta métricas por landing page.
          schema:
            type: string
        - name: negocio_id
          in: query
          required: false
          description: Recorta métricas por negócio.
          schema:
            type: string
        - name: categoria_id
          in: query
          required: false
          description: Recorta métricas por categoria.
          schema:
            type: string
        - name: template_id
          in: query
          required: false
          description: Recorta métricas por template.
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          description: Recorta landing pages por tipo.
          schema:
            type: string
            enum: [white_label, customizavel]
        - name: data_inicio
          in: query
          description: Data inicial inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          description: Data final inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dashboard conforme o papel do usuário autenticado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DashboardUsuarioOutput'
                  - $ref: '#/components/schemas/DashboardAdminOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/clientes:
    get:
      tags: [Opcoes]
      summary: Lista opções de clientes para combos/filtros
      description: Admin/Sognix vê todos os clientes. Usuário comum vê apenas clientes vinculados ao seu usuário.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Busca por nome.
          schema:
            type: string
        - name: usuario_id
          in: query
          required: false
          description: Disponível para admin/Sognix filtrar clientes vinculados a um usuário.
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /opcoes/usuarios:
    get:
      tags: [Opcoes]
      summary: Lista opções de usuários para combos/filtros, admin
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Busca por nome.
          schema:
            type: string
        - name: email
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [usuario, admin]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de usuários
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/negocios:
    get:
      tags: [Opcoes]
      summary: Lista opções de negócios para combos/filtros
      description: Admin/Sognix vê todos; usuário comum vê apenas negócios de clientes vinculados.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de negócios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /opcoes/categorias:
    get:
      tags: [Opcoes]
      summary: Lista opções de categorias para combos/filtros
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de categorias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /opcoes/templates:
    get:
      tags: [Opcoes]
      summary: Lista opções de templates para combos/filtros
      description: Usuário comum deve informar cliente_id e recebe templates oficiais Sognix mais templates daquele cliente, respeitando o plano.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: cliente_id
          in: query
          required: false
          schema:
            type: string
        - name: categoria_id
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          in: query
          required: false
          schema:
            type: string
            enum: [white_label, base_customizavel]
        - name: origem
          in: query
          required: false
          schema:
            type: string
            enum: [sognix, cliente]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Opções de templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaOpcoesOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
