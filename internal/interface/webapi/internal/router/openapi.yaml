        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [LandingPages]
      summary: Atualiza landing page
      description: |
        Atualiza metadados e conteúdo da landing page via PUT completo. Usa controle de versão otimista: envie o `version` atual — se houver conflito (outro usuário salvou antes), retorna 409. Para salvar rascunhos frequentemente, prefira `PATCH /landingpages/{id}/autosave`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarLandingPageInput'
      responses:
        '200':
          description: Landing page atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LandingPageOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [LandingPages]
      summary: Exclui landing page com soft delete
      description: |
        Marca a landing page como excluída (soft delete). Se a LP estiver publicada, é despublicada automaticamente antes da exclusão. Leads e exportações vinculadas são mantidos para auditoria.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Landing page excluída
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /landingpages/{id}/autosave:
    patch:
      tags: [LandingPages]
      summary: Salva rascunho automático da landing page
      description: |
        Endpoint de autosave para o editor. Aceita incrementos frequentes sem exigir o objeto completo. Usa controle de versão otimista (`version`) para evitar sobrescrita silenciosa. Retorna a nova versão após salvar — o frontend deve atualizar o `version` local com o valor retornado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutosaveInput'
      responses:
        '200':
          description: Autosave atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutosaveOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /landingpages/{id}/lock:
    patch:
      tags: [LandingPages]
      summary: Bloqueia landing page para edição concorrente
      description: |
        Cria um lock pessimista de 5 minutos para a LP, identificando o editor pelo `usuario_id`. Enquanto o lock estiver ativo, outros usuários recebem 409 ao tentar editar. O frontend deve renovar o lock antes de expirar chamando este endpoint novamente.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lock criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /landingpages/{id}/unlock:
    patch:
      tags: [LandingPages]
      summary: Remove lock de edição da landing page
      description: |
        Libera o lock pessimista da LP. Deve ser chamado quando o usuário sair da tela de edição (beforeunload). Se o lock já expirou ou pertence a outro usuário, retorna sucesso silencioso.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lock removido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /landingpages/{id}/exportar:
    post:
      tags: [LandingPages, Exportacoes]
      summary: Envia ZIP exportado da landing page
      description: |
        Upload multipart do ZIP gerado pelo frontend para a landing page. O arquivo é validado como ZIP e fica disponível para download em /exportacoes/{id}/download.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo]
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Exportação salva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportacaoOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /landingpages/{id}/publicar:
    post:
      tags: [LandingPages]
      summary: Publica a landing page no hosting estático
      description: |
        Busca a exportação ZIP mais recente da landing page, extrai os arquivos e
        faz deploy via adaptador de hosting configurado. Armazena `url_publica`,
        `deploy_id` e `publicada_em` na LP. Publica evento `landingpage.publicada`
        no outbox quando `OBSERVER_URL` estiver configurado.

        Pré-requisitos:
        - A LP deve ter um `slug` definido.
        - Deve existir ao menos uma exportação ZIP para a LP.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Landing page publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicarLandingPageOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
