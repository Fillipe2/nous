          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /landingpages/{id}/despublicar:
    post:
      tags: [LandingPages]
      summary: Despublica a landing page
      description: |
        Chama o adaptador de hosting para remover o deploy e atualiza o status
        da LP para `rascunho`, limpando `url_publica` e `deploy_id`.
        Retorna 422 se a LP não estiver publicada.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Landing page despublicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Landing page não está publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
  /leads:
    post:
      tags: [Leads]
      summary: Captura lead pelo formulário público da LP
      description: |
        Endpoint público (sem autenticação) chamado pelo formulário da landing page.

        Validações aplicadas:
        - `landingpage_id` deve existir e estar **publicada**.
        - `consentimento` deve ser `true` (LGPD).
        - `email` é normalizado (lowercase + trim) e validado.
        - `telefone` ou `whatsapp` é obrigatório (apenas dígitos após normalização).
        - `mensagem` ≤ 2000 caracteres; `campos_personalizados` ≤ 8KB.
        - Honeypot: o campo `website` deve vir vazio; submissões com ele preenchido
          são descartadas silenciosamente (resposta 201 neutra).
        - Dedupe: mesmo `email` + `landingpage_id` em janela de 5 min retorna o
          lead anterior sem republicar evento.

        Quando `OBSERVER_URL` está configurado, um evento `lead.capturado` é
        publicado no outbox para envio ao Observer/Sbrain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturarLeadInput'
      responses:
        '201':
          description: Lead capturado (ou descartado silenciosamente em caso de honeypot)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapturarLeadOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Landing page inexistente ou não publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      tags: [Leads]
      summary: Lista leads (admin/Sognix)
      description: |
        Usuário comum não acessa dados pessoais de leads. Admin pode filtrar por negocio, landing page, status, UTM e período.
      security:
        - bearerAuth: []
      parameters:
        - name: negocio_id
          description: FK do Negócio dono. Filtra/escopo do recurso por Negócio.
          in: query
          schema:
            type: string
        - name: landingpage_id
          description: FK da Landing Page.
          in: query
          schema:
            type: string
        - name: nome
          description: Filtro parcial por nome (case-insensitive).
          in: query
          schema:
            type: string
        - name: email
          description: Filtro parcial por email.
          in: query
          schema:
            type: string
        - name: status
          description: 'Filtra por status do recurso (ex.: ativo, inativo).'
          in: query
          schema:
            $ref: '#/components/schemas/LeadStatus'
        - name: utm_source
          description: Filtra leads pela origem de campanha (UTM source).
          in: query
          schema:
            type: string
        - name: utm_campaign
          description: Filtra leads pela campanha (UTM campaign).
          in: query
          schema:
            type: string
        - name: data_inicio
          description: Início do período de criação (YYYY-MM-DD).
          in: query
          schema:
            type: string
            format: date
        - name: data_fim
          description: Fim do período de criação (YYYY-MM-DD), inclusivo no dia inteiro.
          in: query
          schema:
            type: string
            format: date
        - name: ordenar_por
          description: 'Campo de ordenação (ex.: nome, criado_em).'
          in: query
          schema:
            type: string
            enum: [nome, email, status, criado_em]
            default: criado_em
        - name: ordem
          description: 'Direção da ordenação: asc ou desc (padrão desc).'
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista paginada de leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaLeadsOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /leads/{id}:
    get:
      tags: [Leads]
      summary: Obtém detalhes do lead (admin/Sognix)
      description: |
        Retorna todos os campos do lead, incluindo dados PII (nome, email, telefone, WhatsApp), UTMs e consentimento LGPD. Exclusivo para `admin/Sognix`. Leads anonimizados retornam os campos PII como `null`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lead encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /leads/{id}/status:
    patch:
      tags: [Leads]
      summary: Atualiza status do lead (admin/Sognix)
      description: |
        Move o lead pelo funil de vendas. Quando `status = perdido`, o campo
        `motivo` passa a ser obrigatório.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarStatusLeadInput'
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /leads/{id}/anonimizar:
    post:
      tags: [Leads]
      summary: Anonimiza um lead (admin/Sognix)
      description: |
        Remove dados pessoais (PII) do lead, mantendo o registro para auditoria.
        Operação idempotente do ponto de vista de PII; retorna 409 se o lead já
        estava anonimizado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lead anonimizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /leads/anonimizar-expirados:
    post:
      tags: [Leads]
      summary: Anonimiza leads expirados em lote (admin/Sognix)
      description: |
        Aplica a retenção LGPD: anonimiza leads cujo `criado_em` é anterior a
        `agora - dias` e que não estão em status `convertido`.
        Sem o parâmetro, usa o padrão de **365 dias**.
      security:
        - bearerAuth: []
      parameters:
        - name: dias
          in: query
          description: Janela de retenção em dias. Padrão 365.
          schema:
            type: integer
            minimum: 1
            default: 365
      responses:
        '200':
          description: Total de leads anonimizados
          content:
            application/json:
              schema:
                type: object
                properties:
                  anonimizados:
                    type: integer
                    example: 27
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /lead_aquisicao:
    post:
      tags: [LeadAquisicao]
      summary: Registra lead de aquisição B2B (formulário público de aquisição Sognix)
      description: |
        Endpoint público (sem autenticação) chamado pelo formulário de aquisição da Sognix.
        Captura dados de potenciais Operadores (Lead Tipo A) interessados em contratar produtos Sognix.

        Validações:
        - `nome` e `email` são obrigatórios.
        - `email` é normalizado e deve ser único (409 em duplicata).
        - `porte` aceita: `micro`, `pequeno`, `medio`, `grande` ou vazio.
        - `mensagem` ≤ 2000 caracteres.
        - Honeypot: o campo `website` deve ficar vazio; preenchido, a submissão é descartada silenciosamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarLeadAquisicaoInput'
      responses:
        '201':
          description: Lead registrado (ou descartado silenciosamente em caso de honeypot)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  mensagem:
                    type: string
                    example: "Obrigado! Entraremos em contato em breve."
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
    get:
      tags: [LeadAquisicao]
      summary: Lista leads de aquisição B2B (admin/Sognix)
      description: |
        Lista leads de aquisição (potenciais Operadores Sognix) com filtros por nome, email, status de funil, porte, localização, UTM e período. Exclusivo para `admin/Sognix`. Suporta paginação e ordenação.
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          description: Filtro parcial por nome (case-insensitive).
          in: query
          required: false
          schema:
            type: string
        - name: email
          description: Filtro parcial por email.
          in: query
          required: false
          schema:
            type: string
        - name: status_funil
          description: Filtra leads de aquisição pela etapa do funil comercial.
          in: query
          required: false
          schema:
            type: string
            enum: [novo, contatado, qualificado, negociacao, convertido, perdido]
        - name: porte
          description: Filtra por porte do negócio.
          in: query
          required: false
          schema:
            type: string
            enum: [micro, pequeno, medio, grande]
        - name: cidade
          description: Filtra por cidade.
          in: query
          required: false
          schema:
            type: string
        - name: estado
          description: Filtra por estado (UF).
          in: query
          required: false
          schema:
            type: string
        - name: utm_campaign
          description: Filtra leads pela campanha (UTM campaign).
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          description: Início do período de criação (YYYY-MM-DD).
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          description: Fim do período de criação (YYYY-MM-DD), inclusivo no dia inteiro.
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          description: 'Campo de ordenação (ex.: nome, criado_em).'
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, status_funil, criado_em]
            default: criado_em
        - name: ordem
          description: 'Direção da ordenação: asc ou desc (padrão desc).'
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de leads de aquisição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaLeadsAquisicaoOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /lead_aquisicao/{id}:
    get:
      tags: [LeadAquisicao]
      summary: Obtém lead de aquisição B2B (admin/Sognix)
      description: |
        Retorna todos os campos do lead de aquisição, incluindo dados de contato, perfil da empresa (porte, categoria pretendida, cidade, estado) e posição no funil comercial. Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Lead de aquisição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAquisicaoOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /lead_aquisicao/{id}/funil:
    patch:
      tags: [LeadAquisicao]
      summary: Atualiza status do funil do lead de aquisição (admin/Sognix)
      description: |
        Avança ou retrocede o lead no funil comercial Sognix (`novo → contatado → qualificado → negociacao → convertido | perdido`). Quando `status_funil=convertido`, informe `convertido_em_usuario_id` com o UUID do usuário criado para o Operador. Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarFunilLeadAquisicaoInput'
      responses:
        '200':
          description: Funil atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /exportacoes:
    get:
      tags: [Exportacoes]
      summary: Lista exportações, admin/Sognix global ou por landing page
      description: |
        Lista exportações (pacotes ZIP) geradas a partir de landing pages. Admin vê todas ou pode filtrar por negocio/LP. Usuário comum deve informar `landingpage_id` de uma LP à qual tem acesso. Use `GET /exportacoes/{id}/download` para baixar o arquivo.
      security:
        - bearerAuth: []
      parameters:
        - name: negocio_id
          in: query
          required: false
          description: Filtro global disponível para admin/Sognix.
          schema:
            type: string
        - name: landingpage_id
          in: query
          required: false
          description: Obrigatório para usuário comum; opcional para admin/Sognix.
          schema:
            type: string
        - name: usuario_id
          description: FK do Operador. Filtra pelo usuário vinculado.
          in: query
          required: false
          schema:
            type: string
        - name: nome_arquivo
          description: Filtro parcial pelo nome do arquivo exportado.
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          description: Início do período de criação (YYYY-MM-DD).
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          description: Fim do período de criação (YYYY-MM-DD), inclusivo no dia inteiro.
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          description: 'Campo de ordenação (ex.: nome, criado_em).'
          in: query
          required: false
          schema:
            type: string
            enum: [nome_arquivo, tamanho_bytes, criado_em]
            default: criado_em
        - name: ordem
          description: 'Direção da ordenação: asc ou desc (padrão desc).'
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de exportações
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExportacaoOutput'
                  total: { type: integer }
                  pagina: { type: integer }
                  por_pagina: { type: integer }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /exportacoes/{id}/download:
    get:
      tags: [Exportacoes]
      summary: Baixa ZIP gerado
      description: |
        Faz o download do arquivo ZIP de uma exportação. O ZIP contém os arquivos estáticos gerados pelo editor (HTML, CSS, JS, assets) prontos para deploy. A exportação deve pertencer a uma LP à qual o usuário tem acesso.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Arquivo ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auditoria:
    get:
      tags: [Auditoria]
      summary: Lista auditoria, admin
      description: |
        Lista eventos de auditoria registrados automaticamente pelo middleware para operações sensíveis (criação, atualização, exclusão, login, etc.). Exclusivo para `admin/Sognix`. Filtre por usuário, negocio, entidade, ação e período. Registros são imutáveis.
      security:
        - bearerAuth: []
      parameters:
        - name: usuario_id
          description: FK do Operador. Filtra pelo usuário vinculado.
          in: query
          required: false
          schema:
            type: string
        - name: acao
          description: 'Filtra auditoria pela ação (ex.: ''POST /negocios'').'
          in: query
          required: false
          schema:
            type: string
        - name: entidade
          description: Filtra auditoria pela entidade afetada.
          in: query
          required: false
          schema:
            type: string
        - name: entidade_id
          description: Filtra auditoria pelo ID da entidade afetada.
          in: query
          required: false
          schema:
            type: string
        - name: status_code
          description: Filtra auditoria pelo HTTP status retornado.
          in: query
          required: false
          schema:
            type: integer
        - name: request_id
          description: Filtra auditoria pelo identificador da requisição.
          in: query
          required: false
          schema:
            type: string
        - name: data_inicio
          description: Início do período de criação (YYYY-MM-DD).
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          description: Fim do período de criação (YYYY-MM-DD), inclusivo no dia inteiro.
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          description: 'Campo de ordenação (ex.: nome, criado_em).'
          in: query
          required: false
          schema:
            type: string
            enum: [acao, entidade, status_code, tempo_resposta_ms, criado_em]
            default: criado_em
        - name: ordem
          description: 'Direção da ordenação: asc ou desc (padrão desc).'
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de auditoria
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditoriaOutput'
                  total: { type: integer }
                  pagina: { type: integer }
                  por_pagina: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auditoria/{id}:
    get:
      tags: [Auditoria]
      summary: Obtém evento de auditoria, admin
      description: |
        Retorna os detalhes completos de um evento de auditoria: quem fez (`usuario_id`), o quê (`entidade` + `entidade_id`), quando (`criado_em`), de onde (`ip`, `user_agent`) e o payload de mudança (`metadados`). Exclusivo para `admin/Sognix`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Auditoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditoriaOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: UUID do recurso na URL.
      schema:
        type: string
        format: uuid
    Pagina:
      name: pagina
      in: query
      required: false
      description: Página da listagem (1-based). Padrão 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PorPagina:
      name: por_pagina
      in: query
      required: false
      description: Itens por página (máx. 100). Padrão 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Forbidden:
      description: Acesso negado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NotFound:
      description: Registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Conflict:
      description: Conflito de versão ou lock
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    TooManyRequests:
      description: Limite de requisições excedido (rate limit). Veja o cabeçalho `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ServiceUnavailable:
      description: Serviço externo ou integração não configurada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
  schemas:
    Erro:
      type: object
      properties:
        erro:
          type: string
        codigo:
          type: string
        mensagem:
          type: string
        request_id:
          type: string
    MensagemOutput:
      type: object
      properties:
        mensagem:
          type: string
    LandingPageUtilizadaOutput:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        total_exportacoes:
          type: integer
    DashboardUsuarioOutput:
      type: object
      properties:
        usuario_id:
          type: string
        negocios_vinculados:
          type: integer
        landingpages_criadas:
          type: integer
        landingpages_online:
          type: integer
        exportacoes_geradas:
          type: integer
        landingpage_mais_usada:
          $ref: '#/components/schemas/LandingPageUtilizadaOutput'
    DashboardAdminOutput:
      type: object
      properties:
        negocios_ativos:
          type: integer
        usuarios_ativos:
          type: integer
        templates_sognix:
          type: integer
        templates_negocios:
          type: integer
        landingpages_criadas:
          type: integer
        landingpages_online:
          type: integer
        leads_capturados:
          type: integer
        exportacoes_geradas:
          type: integer
        negocios_com_plano_customizavel:
          type: integer
    OpcaoOutput:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        label:
          type: string
        status:
          type: string
        tipo:
          type: string
        origem:
          type: string
        negocio_id:
          type: string
        categoria_id:
          type: string
    ListaOpcoesOutput:
      type: object
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/OpcaoOutput'
        total:
          type: integer
        pagina:
          type: integer
        por_pagina:
          type: integer
    LoginInput:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
    RefreshTokenInput:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    LoginOutput:
      type: object
      properties:
        token:
          type: string
          description: 'Access token JWT de curta duração. Enviar em Authorization: Bearer <token>.'
        refresh_token:
          type: string
          description: Refresh token opaco de longa duração. Usar em `POST /auth/refresh`.
        usuario:
          $ref: '#/components/schemas/UsuarioOutput'
        negocios:
          type: array
          description: Negócios (entidade contratante) vinculados a este Operador.
          items:
            $ref: '#/components/schemas/NegocioBasicoOutput'
    UsuarioOutput:
      type: object
      description: >-
        Operador — o usuário que opera o Nous. Vincula-se a N Negócios pela tabela
        `usuario_negocio`. `role=admin` é staff interno da Sognix com visão global.
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [usuario, admin] }
        status: { type: string, enum: [ativo, inativo, excluido] }
        email_verified: { type: boolean, description: true em login Google e no admin do seed. }
        ultimo_login_em: { type: string, format: date-time, nullable: true }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        version: { type: integer, description: Versão para controle otimista; reenvie em PUT/PATCH. }
    NegocioOutput:
      type: object
      description: >-
        Negócio — entidade contratante (clínica/escritório do Operador), com CPF/CNPJ.
        Antes chamada `cliente`. Um Operador tem N Negócios; cada Negócio é dono de
        Unidades, Landing Pages, Templates próprios e Assinatura/Plano.
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        telefone: { type: string }
        whatsapp: { type: string }
        documento: { type: string, description: 'CPF (11 dígitos) ou CNPJ (14, alfanumérico a partir de 2026), sem máscara. Opcional.' }
        status: { type: string, enum: [ativo, inativo, excluido] }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        version: { type: integer }
    NegocioBasicoOutput:
      type: object
      description: Versão enxuta do Negócio retornada no login e em listagens do próprio Operador.
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        telefone: { type: string }
        whatsapp: { type: string }
        documento: { type: string }
        status: { type: string, enum: [ativo, inativo, excluido] }
    UnidadeOutput:
      type: object
      description: >-
        Unidade — sub-unidade de um Negócio (ex.: filial/local). Antes chamada `negocio`.
        Pertence a um Negócio e pode ser referenciada (opcionalmente) por Landing Pages.
      properties:
        id: { type: string, format: uuid }
        negocio_id: { type: string, format: uuid, description: FK do Negócio dono (obrigatório). }
        nome: { type: string }
        status: { type: string, enum: [ativo, inativo, excluido] }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        version: { type: integer }
    CategoriaOutput:
      type: object
      description: 'Categoria/vertical (ex.: odonto, jurídico). Classifica Negócios, Templates e Landing Pages. Gerenciada por admin.'
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        status: { type: string, enum: [ativo, inativo, excluido] }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        version: { type: integer }
    TemplateOutput:
      type: object
      description: >-
        Template de Landing Page. `origem=sognix` é oficial e global (negocio_id nulo);
        `origem=negocio` pertence a um Negócio (negocio_id preenchido) e só é visível a ele.
      properties:
        id: { type: string, format: uuid }
        negocio_id: { type: string, format: uuid, description: 'FK do Negócio dono; presente apenas quando origem=negocio.' }
        categoria_id: { type: string, format: uuid }
        tipo: { type: string, enum: [white_label, base_customizavel] }
        origem: { type: string, enum: [sognix, negocio] }
        nome: { type: string }
        arquivo_url: { type: string }
        conteudo: { type: string }
        tem_arquivo: { type: boolean, description: true quando há pacote .zip binário associado. }
        nome_arquivo: { type: string }
        content_type: { type: string }
        tamanho_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [ativo, inativo, excluido] }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
    LandingPageOutput:
      type: object
      description: >-
        Landing Page de um Negócio. Concorrência: `version` (otimista) e lock pessimista
        (`locked_by`/`locked_at`, expira em 5 min). Publicação preenche `url_publica`/`deploy_id`.
      properties:
        id: { type: string, format: uuid }
        negocio_id: { type: string, format: uuid, description: FK do Negócio dono (obrigatório). }
        unidade_id: { type: string, format: uuid, description: FK da Unidade (opcional). }
        categoria_id: { type: string, format: uuid, description: FK da Categoria (opcional). }
        template_id: { type: string, format: uuid, description: FK do Template base (opcional). }
        tipo: { type: string, enum: [white_label, customizavel] }
        nome: { type: string }
        slug: { type: string }
        conteudo: { type: string }
        status: { type: string, enum: [rascunho, publicada, despublicada, excluida] }
        is_draft: { type: boolean }
        autosave_data: { type: object, nullable: true, description: Último rascunho salvo via autosave (JSON livre). }
        last_autosave_em: { type: string, format: date-time, nullable: true }
        locked_by: { type: string, format: uuid, nullable: true, description: Operador que detém o lock de edição. }
        locked_at: { type: string, format: date-time, nullable: true }
        url_publica: { type: string, nullable: true }
        deploy_id: { type: string, nullable: true }
        publicada_em: { type: string, format: date-time, nullable: true }
        criado_em: { type: string, format: date-time }
        atualizado_em: { type: string, format: date-time }
        version: { type: integer }
    AuditoriaOutput:
      type: object
      description: >-
        Registro de auditoria de uma ação autenticada (somente admin). Contém apenas
        metadados da requisição; `dados_novos` guarda método/path/request_id.
      properties:
        id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid, nullable: true, description: Operador que executou a ação. }
        acao: { type: string, description: 'Ex.: POST /negocios.' }
        entidade: { type: string }
        entidade_id: { type: string, nullable: true }
        dados_anteriores: { type: object, nullable: true }
        dados_novos: { type: object, nullable: true }
        ip: { type: string }
        user_agent: { type: string }
        status_code: { type: integer }
        tempo_resposta_ms: { type: integer }
        request_id: { type: string }
        criado_em: { type: string, format: date-time }
    ExportacaoOutput:
      type: object
      description: Pacote ZIP exportado de uma Landing Page, armazenado no PostgreSQL com hash SHA-256.
      properties:
        id: { type: string, format: uuid }
        landingpage_id: { type: string, format: uuid, description: FK da Landing Page exportada. }
        usuario_id: { type: string, format: uuid, description: FK do Operador que gerou a exportação. }
        nome_arquivo: { type: string }
        content_type: { type: string }
        tamanho_bytes: { type: integer, format: int64 }
        hash: { type: string, description: SHA-256 do ZIP. }
        criado_em: { type: string, format: date-time }
    CriarUsuarioInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Mínimo de 8 caracteres (limite de 72 do bcrypt).
    AlterarRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [usuario, admin]
          description: Novo papel do usuário.
    AlterarStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ativo, inativo]
          description: Novo status do usuário. `excluido` não é aceito aqui (use DELETE).
    SolicitarVerificacaoEmailInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    SolicitarVerificacaoEmailOutput:
      type: object
      required: [mensagem]
      properties:
        mensagem:
          type: string
        verificacao_token:
          type: string
          description: Retornado apenas quando EMAIL_VERIFICATION_RETURN_TOKEN=true.
    VerificarEmailInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
    AtualizarUsuarioInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        version:
          type: integer
          description: Versão atual do usuário (controle de concorrência otimista). Se houver conflito, retorna 409.
    AlterarSenhaInput:
      type: object
      required: [senha_atual, nova_senha]
      properties:
        senha_atual:
          type: string
          format: password
        nova_senha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Mínimo de 8 caracteres (limite de 72 do bcrypt).
    EsqueciSenhaInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    EsqueciSenhaOutput:
      type: object
      required: [mensagem]
      properties:
        mensagem:
          type: string
        reset_token:
          type: string
          description: Retornado apenas quando RESET_PASSWORD_RETURN_TOKEN=true.
    RedefinirSenhaInput:
      type: object
      required: [token, nova_senha]
      properties:
        token:
          type: string
        nova_senha:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Mínimo de 8 caracteres (limite de 72 do bcrypt).
    CriarNegocioInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        whatsapp:
          type: string
        documento:
          type: string
          maxLength: 14
          description: >-
            CPF (11 dígitos) ou CNPJ (14 posições, alfanuméricas a partir de 2026)
            do negócio. Opcional. Aceita com ou sem máscara; é normalizado para
            apenas caracteres significativos em maiúsculas e validado pelo dígito
            verificador.
          example: "12345678000190"
    AtualizarNegocioInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        whatsapp:
          type: string
        documento:
          type: string
          maxLength: 14
          description: >-
            CPF ou CNPJ do negócio (ver CriarNegocioInput). Validado quando informado.
          example: "12345678000190"
        version:
          type: integer
    CriarUnidadeInput:
      type: object
      required: [negocio_id, nome]
      properties:
        negocio_id:
          type: string
        nome:
          type: string
    AtualizarUnidadeInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        version:
          type: integer
    CriarCategoriaInput:
      type: object
      required: [nome]
      properties:
        nome:
          type: string
    AtualizarCategoriaInput:
      type: object
      required: [version]
      properties:
        nome:
          type: string
        version:
          type: integer
    CriarLandingPageInput:
      type: object
      required: [negocio_id, nome]
      properties:
        negocio_id:
          type: string
        unidade_id:
          type: string
        categoria_id:
          type: string
        template_id:
          type: string
        tipo:
          type: string
          enum: [white_label, customizavel]
          default: white_label
        nome:
          type: string
        slug:
          type: string
          description: Slug da URL pública. Se omitido, é gerado automaticamente a partir do nome.
        conteudo:
          type: string
          description: Permitido para landing pages customizáveis. White label parte do conteúdo do template.
    AtualizarLandingPageInput:
      type: object
      required: [version]
      properties:
        unidade_id:
          type: string
        categoria_id:
          type: string
        template_id:
          type: string
        tipo:
          type: string
          enum: [white_label, customizavel]
        nome:
          type: string
        slug:
          type: string
          description: Slug da URL pública. Deve ser único entre as landing pages.
        conteudo:
          type: string
        status:
          type: string
        version:
          type: integer
    AutosaveInput:
      type: object
      required: [autosave_data, version]
      properties:
        autosave_data:
          type: object
          additionalProperties: true
        version:
          type: integer
    AutosaveOutput:
      type: object
      description: Resultado do autosave; devolve a nova `version` para o próximo envio.
      properties:
        mensagem:
          type: string
        version:
          type: integer
    LeadStatus:
      type: string
      description: |
        Funil padrao de leads:
        novo -> contatado -> qualificado -> negociacao -> proposta_enviada -> convertido | perdido.
      enum:
        - novo
        - contatado
        - qualificado
        - negociacao
        - proposta_enviada
        - convertido
        - perdido
    UTMInput:
      type: object
      description: Atribuicao de marketing capturada pela landing page.
      properties:
        source:
          type: string
          example: google
        medium:
          type: string
          example: cpc
        campaign:
          type: string
          example: lancamento_q2
        content:
          type: string
        term:
          type: string
    CapturarLeadInput:
      type: object
      required: [landingpage_id, nome, email, consentimento]
      description: |
        Payload publico enviado pelo formulario da landing page. O campo `website`
        e um honeypot anti-bot que deve permanecer vazio. O consentimento e
        obrigatorio para conformidade com a LGPD.
      properties:
        landingpage_id:
          type: string
        nome:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        telefone:
          type: string
          description: Aceita formato livre; sera normalizado para apenas digitos (com `+` opcional).
        whatsapp:
          type: string
        mensagem:
          type: string
          maxLength: 2000
        campos_personalizados:
          type: object
          description: Campos customizados configurados na landing page (limite ~8KB).
          additionalProperties: true
        consentimento:
          type: boolean
          description: Obrigatorio. Deve ser `true` para que o lead seja persistido (LGPD).
        politica_versao:
          type: string
          description: Versao da politica de privacidade aceita pelo titular.
          example: "2026-01-15"
        utm:
          $ref: '#/components/schemas/UTMInput'
        referrer:
          type: string
          description: Preenchido automaticamente pelo header `Referer` quando ausente.
        website:
          type: string
          description: Honeypot anti-spam. Deve ficar vazio; submissoes preenchidas sao descartadas silenciosamente.
    CapturarLeadOutput:
      type: object
      required: [id, mensagem]
      properties:
        id:
          type: string
        mensagem:
          type: string
          example: "Obrigado! Entraremos em contato em breve."
    LeadOutput:
      type: object
      required: [id, landingpage_id, nome, email, status, criado_em, consentimento]
      properties:
        id:
          type: string
        landingpage_id:
          type: string
        landingpage_nome:
          type: string
        negocio_id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        whatsapp:
          type: string
        mensagem:
          type: string
        campos_personalizados:
          type: object
          additionalProperties: true
        origem:
          type: string
          example: formulario_lp
        status:
          $ref: '#/components/schemas/LeadStatus'
        perdido_motivo:
          type: string
          description: Obrigatorio quando `status = perdido`.
        utm:
          $ref: '#/components/schemas/UTMInput'
        referrer:
          type: string
        consentimento:
          type: boolean
        consentimento_em:
          type: string
          format: date-time
        politica_versao:
          type: string
        anonimizado_em:
          type: string
          format: date-time
          description: Preenchido apos anonimizacao (LGPD); demais campos PII viram nulos.
        criado_em:
          type: string
          format: date-time
    ListaLeadsOutput:
      type: object
      required: [dados, total, pagina, por_pagina]
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/LeadOutput'
        total:
          type: integer
        pagina:
          type: integer
        por_pagina:
          type: integer
    AtualizarStatusLeadInput:
      type: object
      required: [status]
      description: |
        Atualiza o status no funil. Quando `status = perdido`, `motivo` torna-se obrigatorio.
      properties:
        status:
          $ref: '#/components/schemas/LeadStatus'
        motivo:
          type: string
          maxLength: 500
          description: Obrigatorio quando `status = perdido`. Texto livre para registrar a razao.
    PublicarLandingPageOutput:
      type: object
      properties:
        mensagem:
          type: string
          example: landingpage publicada com sucesso
        url_publica:
          type: string
          example: https://minha-lp.exemplo.com
        deploy_id:
          type: string
    RegistrarLeadAquisicaoInput:
      type: object
      required: [nome, email]
      description: |
        Payload público enviado pelo formulário de aquisição da Sognix. O campo `website`
        é um honeypot anti-bot que deve permanecer vazio.
      properties:
        nome:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        telefone:
          type: string
        categoria_pretendida_id:
          type: string
          description: UUID de categoria existente, se conhecido.
        categoria_pretendida_livre:
          type: string
          description: Nome livre da categoria/especialidade pretendida.
        cidade:
          type: string
        estado:
          type: string
          maxLength: 2
          example: SP
        porte:
          type: string
          enum: [micro, pequeno, medio, grande]
        interesses:
          type: object
          additionalProperties: true
          description: Campos livres de interesse declarado.
        mensagem:
          type: string
          maxLength: 2000
        origem:
          type: string
          description: Identificador da campanha ou página de origem.
        utm:
          $ref: '#/components/schemas/UTMInput'
        website:
          type: string
          description: Honeypot anti-spam. Deve ficar vazio; submissões preenchidas são descartadas silenciosamente.
    AtualizarFunilLeadAquisicaoInput:
      type: object
      required: [status_funil]
      properties:
        status_funil:
          type: string
          enum: [novo, contatado, qualificado, negociacao, convertido, perdido]
        convertido_em_usuario_id:
          type: string
          description: UUID do usuário criado quando o lead se converte em Operador.
    LeadAquisicaoOutput:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
        categoria_pretendida_id:
          type: string
        categoria_pretendida_livre:
          type: string
        cidade:
          type: string
        estado:
          type: string
        porte:
          type: string
        interesses:
          type: object
          additionalProperties: true
        mensagem:
          type: string
        origem:
          type: string
        utm:
          $ref: '#/components/schemas/UTMInput'
        status_funil:
          type: string
        convertido_em_usuario_id:
          type: string
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
    ListaLeadsAquisicaoOutput:
      type: object
      properties:
        dados:
          type: array
          items:
            $ref: '#/components/schemas/LeadAquisicaoOutput'
        total:
          type: integer
        pagina:
          type: integer
        por_pagina:
          type: integer
