        Lista templates disponíveis. Admin vê todos (Sognix + todos os negocios). Usuário comum filtra por `negocio_id` e vê templates oficiais Sognix + templates do negocio informado, respeitando o plano contratado. Suporta filtro por categoria, tipo e origem.
      security:
        - bearerAuth: []
      parameters:
        - name: negocio_id
          in: query
          required: false
          description: Admin/Sognix pode filtrar templates de um negocio; usuário comum deve informar o negocio vinculado.
          schema:
            type: string
        - name: categoria_id
          description: FK da Categoria (vertical).
          in: query
          required: false
          schema:
            type: string
        - name: tipo
          description: Filtra por tipo (depende do recurso; ver enums em /opcoes/enums).
          in: query
          required: false
          schema:
            type: string
            enum: [white_label, base_customizavel]
        - name: origem
          description: 'Filtra por origem do template: sognix (oficial) ou negocio (do Negócio).'
          in: query
          required: false
          schema:
            type: string
            enum: [sognix, negocio]
        - name: nome
          description: Filtro parcial por nome (case-insensitive).
          in: query
          required: false
          schema:
            type: string
        - name: status
          description: 'Filtra por status do recurso (ex.: ativo, inativo).'
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          description: Início do período de criação (YYYY-MM-DD).
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          description: Fim do período de criação (YYYY-MM-DD), inclusivo no dia inteiro.
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          description: 'Campo de ordenação (ex.: nome, criado_em).'
          in: query
          required: false
          schema:
            type: string
            enum: [nome, tipo, origem, status, criado_em, atualizado_em]
            default: nome
        - name: ordem
          description: 'Direção da ordenação: asc ou desc (padrão desc).'
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/TemplateOutput'
                  total: { type: integer }
                  pagina: { type: integer }
                  por_pagina: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Templates]
      summary: Cadastra template pronto no banco
      description: |
        Admin pode criar templates oficiais Sognix ou templates de negocio. Usuário comum só pode criar template do negocio ao qual tem acesso.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nome]
              description: |
                Informe `conteudo` (HTML/texto) **ou** `arquivo`. Para templates white label,
                envie o pacote `.zip` no campo `arquivo`: ele é validado (estrutura, zip-slip,
                limite de descompressão) e armazenado em binário, ficando disponível em
                `GET /templates/{id}/download`. Arquivos de texto (não-zip) precisam ser UTF-8
                válido e seu conteúdo é salvo em `conteudo`.
              properties:
                negocio_id:
                  type: string
                  description: Obrigatório quando origem=negocio.
                categoria_id:
                  type: string
                origem:
                  type: string
                  enum: [sognix, negocio]
                  default: sognix
                tipo:
                  type: string
                  enum: [white_label, base_customizavel]
                  default: white_label
                nome:
                  type: string
                conteudo:
                  type: string
                  description: Conteúdo textual do template (HTML). Obrigatório quando nenhum arquivo é enviado.
                arquivo:
                  type: string
                  format: binary
                  description: |
                    Pacote `.zip` do template white label (armazenado em binário) ou um arquivo
                    de texto UTF-8 (salvo em `conteudo` quando este estiver vazio).
