openapi: 3.0.3
info:
  title: Nous API
  version: 1.3.0
  description: |
    API REST do Nous, o backend do Buildnix: construção, gestão, autosave, exportação
    de landing pages, captura/gestão de leads e auditoria. O papel `admin` representa
    usuários internos da Sognix com visão operacional global.

    ## Modelo de entidades e relacionamentos

    Quem implementa o frontend deve entender estas entidades e como seus IDs se ligam:

    - **Operador** (`UsuarioOutput`) — o usuário que faz login. Tem `role` (`usuario`/`admin`)
      e status. Vincula-se a **N Negócios** pela tabela `usuario_negocio` (o vínculo é
      criado automaticamente quando o próprio Operador cria um Negócio).
    - **Negócio** (`NegocioOutput`) — a entidade contratante (clínica/escritório), com
      CPF/CNPJ. **Antes chamava-se `cliente`.** É o agregador central: dono de Unidades,
      Landing Pages, Templates próprios e Assinatura/Plano. A maioria dos recursos é
      filtrada por `negocio_id`.
    - **Unidade** (`UnidadeOutput`) — sub-unidade de um Negócio (ex.: filial). **Antes
      chamava-se `negocio`.** Carrega `negocio_id` (dono) e pode ser referenciada
      opcionalmente por uma Landing Page (`unidade_id`).
    - **Categoria** (`CategoriaOutput`) — vertical (odonto, jurídico, …). Classifica
      Negócios, Templates e Landing Pages. Gerenciada por admin.
    - **Template** (`TemplateOutput`) — base de Landing Page. `origem=sognix` (oficial,
      global, `negocio_id` nulo) ou `origem=negocio` (do próprio Negócio).
    - **Landing Page** (`LandingPageOutput`) — pertence a um Negócio (`negocio_id`
      obrigatório) e opcionalmente a uma Unidade/Categoria/Template. Gera **Exportações**.
    - **Exportação** (`ExportacaoOutput`) — ZIP de uma Landing Page (`landingpage_id`),
      com hash SHA-256, gerada por um Operador (`usuario_id`).
    - **Lead Tipo B** (`LeadOutput`) — visitante capturado pela Landing Page pública.
      Dados pessoais restritos a admin/Sognix.
    - **Lead de Aquisição / Tipo A** (`LeadAquisicaoOutput`) — potencial Operador (funil
      comercial B2B da Sognix).

    ```text
    Operador ──(usuario_negocio, N:N)── Negócio ──1:N── Unidade
                                          │
                                          ├──1:N── LandingPage ──1:N── Exportacao
                                          │           └─ opcional → Unidade / Categoria / Template
                                          ├──1:N── Template (origem=negocio)
                                          └──1:N── Assinatura/Plano, métricas
    LandingPage (pública) ──1:N── Lead (Tipo B)
    ```

    ## Cabeçalhos e fluxo de auth

    - Endpoints autenticados usam `Authorization: Bearer <access_token>` (do `LoginOutput.token`).
    - Quando o access token expira, troque o `refresh_token` em `POST /auth/refresh`
      (rotação: o refresh anterior é revogado).
    - `admin` (staff Sognix) tem visão global; `usuario` só enxerga os Negócios vinculados.

    ## Concorrência

    - **Otimista:** entidades editáveis têm `version`. Reenvie o `version` lido em
      PUT/PATCH/autosave; versão obsoleta retorna **409** sem sobrescrever.
    - **Pessimista (Landing Page):** `lock`/`unlock` com `locked_by`/`locked_at`,
      expira em 5 min.

    **Eventos / mensageria**: a publicação para o Observer é opcional. Quando
    `OBSERVER_URL` não está configurado, eventos como `lead.capturado` ficam apenas no
    outbox local. O Nous é totalmente funcional em modo standalone.

    **Convenções**:
    - Identificadores são UUID em string.
    - Datas em ISO-8601 (`format: date-time`); filtros `data_inicio`/`data_fim` em `YYYY-MM-DD`.
    - Erros sempre retornam `application/json` no formato `Erro` (`erro`, `codigo`, `mensagem`, `request_id`).
    - Listagens paginadas retornam `{ dados[], total, pagina, por_pagina }`.
    - Endpoints autenticados usam `Authorization: Bearer <jwt>`.
servers:
  - url: /
    description: Servidor atual
tags:
  - name: Auth
    description: Login, refresh, logout, recuperação de senha e OAuth2 Google.
  - name: Usuarios
    description: Cadastro próprio, perfil autenticado e gestão administrativa.
  - name: Negocios
    description: Empresas/contas que detêm landing pages. Auto-vinculação na criação.
  - name: Dashboard
    description: Resumos operacionais (visão usuário ou admin).
  - name: Opcoes
    description: Listagens auxiliares para combos/filtros do frontend.
  - name: Unidades
    description: Unidades vinculados a um negocio (segmentação interna).
  - name: Categorias
    description: Categorias de templates e landing pages.
  - name: Templates
    description: Templates de origem Sognix ou subidos pelo negocio.
  - name: LandingPages
    description: CRUD, autosave com versionamento otimista, lock pessimista e exportação.
  - name: Leads
    description: |
      Captura pública (formulário da LP) e gestão restrita ao admin/Sognix.
      Dados pessoais são tratados como ativo comercial e ficam fora do dashboard
      do negocio comum. Inclui consentimento LGPD, UTMs e endpoints de anonimização.
  - name: Exportacoes
    description: Pacotes ZIP gerados a partir de landing pages.
  - name: LeadAquisicao
    description: |
      Captura pública de leads de aquisição B2B (Lead Tipo A — potenciais Operadores Sognix).
      Gestão de funil restrita ao admin/Sognix.
  - name: Auditoria
    description: Trilha imutável de operações sensíveis.
  - name: Sistema
    description: Healthcheck, especificação OpenAPI e JWKS.
paths:
  /.well-known/jwks.json:
    get:
      tags: [Sistema]
      summary: Chaves públicas para validação de tokens RS256
      description: |
        Retorna o conjunto de chaves públicas (JWKS) que permite ao novo backend
        validar tokens JWT emitidos pelo Nous quando `JWT_RSA_PRIVATE_KEY` está
        configurado (RS256). Sem a chave RSA configurada, retorna 503.
      responses:
        '200':
          description: JWKS com chave pública RSA
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        kty:
                          type: string
                          example: RSA
                        use:
                          type: string
                          example: sig
                        alg:
                          type: string
                          example: RS256
                        kid:
                          type: string
                        n:
                          type: string
                        e:
                          type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      tags: [Sistema]
      summary: Healthcheck da API
      description: |
        Retorna `{"status":"ok"}` se a aplicação subiu corretamente. Não verifica banco ou Redis — é um ping rápido usado por load balancers e readiness probes.
      responses:
        '200':
          description: API em execução
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /swagger:
    get:
      tags: [Sistema]
      summary: Exibe a interface Swagger UI para testar a API
      description: |
        Abre a documentação interativa da API. Use para explorar e testar endpoints sem precisar de negocio HTTP externo. Autenticação via botão **Authorize** (cole o `access_token` retornado pelo login).
      responses:
        '200':
          description: Página HTML do Swagger UI
          content:
            text/html:
              schema:
                type: string
  /swagger/openapi.yaml:
    get:
      tags: [Sistema]
      summary: Retorna a especificação OpenAPI embarcada
      description: |
        Retorna o arquivo `openapi.yaml` compilado dentro do binário. Útil para importar no Postman, Insomnia ou gerar SDKs de negocio.
      responses:
        '200':
          description: Especificação YAML
  /auth/login:
    post:
      tags: [Auth]
      summary: Login tradicional
      description: |
        Autentica com `email` + `senha` e retorna `access_token` (JWT de curta duração) e `refresh_token` (opaco, longa duração). O `access_token` deve ser enviado como `Authorization: Bearer <token>` em todas as requisições autenticadas.

        Protegido contra força bruta: rate limit por IP (pode retornar `429`) e bloqueio temporário por conta após sucessivas falhas (responde `401`, igual a credencial inválida, para não revelar o bloqueio).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova token JWT
      description: |
        Troca um `refresh_token` válido por um novo par `access_token` / `refresh_token`. O token antigo é imediatamente revogado (rotação). Use quando o `access_token` expirar (HTTP 401) antes de forçar o usuário a fazer login novamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenInput'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout local do negocio
      description: |
        Revoga o `refresh_token` do negocio atual. O `access_token` não é invalidado (JWT stateless), mas expira naturalmente. Para logout em todos os dispositivos, revogue todos os tokens via gestão de usuário.
      responses:
        '200':
          description: Logout realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
  /auth/esqueci-senha:
    post:
      tags: [Auth]
      summary: Solicita redefinição de senha
      description: |
        Sempre retorna mensagem genérica e aplica duração mínima para reduzir enumeração por resposta/timing. O token só é retornado quando RESET_PASSWORD_RETURN_TOKEN=true em ambiente local/teste.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EsqueciSenhaInput'
      responses:
        '200':
          description: Solicitação registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EsqueciSenhaOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/redefinir-senha:
    post:
      tags: [Auth]
      summary: Redefine senha com token de uso único
      description: Ao redefinir a senha, refresh tokens ativos do usuário são revogados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirSenhaInput'
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/solicitar-verificacao-email:
    post:
      tags: [Auth]
      summary: Solicita verificação de email
      description: |
        Gera um token de verificação para um usuário ativo e ainda não verificado. A resposta é sempre neutra (não revela se o email existe). Sem provedor de email configurado, o token só volta na resposta quando `EMAIL_VERIFICATION_RETURN_TOKEN=true` (uso em desenvolvimento/testes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarVerificacaoEmailInput'
      responses:
        '200':
          description: Solicitação registrada (resposta neutra)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitarVerificacaoEmailOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verificar-email:
    post:
      tags: [Auth]
      summary: Confirma o email com token de uso único
      description: Marca o email do usuário como verificado. Token inválido, usado ou expirado retorna 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarEmailInput'
      responses:
        '200':
          description: Email verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/google/login:
    get:
      tags: [Auth]
      summary: Inicia login Google OAuth2 (abrir no navegador)
      description: |
        **Não use o "Try it out" do Swagger** para este endpoint. O fluxo OAuth depende
        de navegação top-level no navegador: a tentativa via `fetch()` segue o redirect
        para `accounts.google.com`, que não envia headers CORS para `localhost`, e o
        Swagger mostra "Failed to fetch".

        Como testar:
        1. Abra `GET /auth/google/login` em uma **aba nova** do navegador.
        2. Faça consentimento no Google.
        3. O Google redireciona para `/auth/google/callback`, que retorna `LoginOutput`
           (access/refresh tokens) em JSON.

        Cria cookie HttpOnly `oauth_state` (CSRF) e redireciona para o Google. Requer
        `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET` e `GOOGLE_REDIRECT_URL` configurados.
      responses:
        '307':
          description: Redirecionamento temporário para Google OAuth2
          headers:
            Location:
              description: URL de autorização do Google
              schema:
                type: string
            Set-Cookie:
              description: Cookie HttpOnly `oauth_state` usado para validação CSRF
              schema:
                type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Callback do Google OAuth2 (chamado pelo navegador)
      description: |
        **Não invoque manualmente pelo Swagger.** Este endpoint é alvo do redirect do
        Google após o consentimento e exige o cookie `oauth_state` setado por
        `/auth/google/login` no mesmo navegador.

        Valida `state` contra o cookie `oauth_state`, troca `code` por token Google
        e retorna os tokens JWT do Nous.
      parameters:
        - name: code
          description: Código de autorização retornado pelo Google (OAuth2).
          in: query
          required: true
          schema:
            type: string
        - name: state
          description: Token CSRF do fluxo OAuth2 (validado contra o cookie).
          in: query
          required: true
          schema:
            type: string
        - name: error
          description: Erro retornado pelo Google quando o usuário nega o consentimento.
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Autenticado via Google
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /usuarios:
    post:
      tags: [Usuarios]
      summary: Cria usuário comum
      description: |
        Cria uma conta de usuário com papel `usuario` (rota pública). O papel é sempre `usuario` — não é possível criar admin por aqui; a promoção é feita por um admin via `PATCH /usuarios/{id}/role`. Após criar, o usuário já pode fazer login via `POST /auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarUsuarioInput'
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Usuarios]
      summary: Lista usuários, admin
      description: |
        Lista todos os usuários do sistema. Exclusivo para `admin/Sognix`. Suporta filtros por nome, email, papel, status e período de criação, com paginação e ordenação.
      security:
        - bearerAuth: []
      parameters:
        - name: nome
          description: Filtro parcial por nome (case-insensitive).
          in: query
          required: false
          schema:
            type: string
        - name: email
          description: Filtro parcial por email.
          in: query
          required: false
          schema:
            type: string
        - name: role
          description: 'Filtra por papel: usuario ou admin.'
          in: query
          required: false
          schema:
            type: string
            enum: [usuario, admin]
        - name: status
          description: 'Filtra por status do recurso (ex.: ativo, inativo).'
          in: query
          required: false
          schema:
            type: string
            enum: [ativo, inativo, excluido]
        - name: data_inicio
          in: query
          description: Data inicial inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: data_fim
          in: query
          description: Data final inclusiva no formato YYYY-MM-DD.
          required: false
          schema:
            type: string
            format: date
        - name: ordenar_por
          description: 'Campo de ordenação (ex.: nome, criado_em).'
          in: query
          required: false
          schema:
            type: string
            enum: [nome, email, role, status, criado_em, atualizado_em]
            default: criado_em
        - name: ordem
          description: 'Direção da ordenação: asc ou desc (padrão desc).'
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsuarioOutput'
                  total: { type: integer }
                  pagina: { type: integer }
                  por_pagina: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usuarios/me:
    get:
      tags: [Usuarios]
      summary: Obtém o usuário autenticado
      description: |
        Retorna os dados do usuário dono do `access_token` atual (nome, email, papel, negocios vinculados). Usado pelo frontend para montar o perfil e decidir o que exibir conforme o papel.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios/me/senha:
    patch:
      tags: [Usuarios]
      summary: Altera a senha do usuário autenticado
      description: |
        Troca a senha do usuário logado. Exige a senha atual como confirmação. Após a troca, todos os `refresh_tokens` ativos são revogados — o usuário precisará fazer login novamente em outros dispositivos.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaInput'
      responses:
        '200':
          description: Senha alterada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /usuarios/{id}:
    put:
      tags: [Usuarios]
      summary: Atualiza usuário
      description: |
        Atualiza nome e/ou email de um usuário. Admin pode atualizar qualquer usuário; usuário comum só pode atualizar a si mesmo. Usa controle de concorrência otimista: envie o `version` atual — conflito de versão ou email duplicado retorna 409.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarUsuarioInput'
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Usuarios]
      summary: Exclui usuário com soft delete
      description: |
        Marca o usuário como excluído (soft delete). O registro é mantido no banco para auditoria. O usuário não consegue mais fazer login. Somente `admin` pode excluir outros usuários.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Usuário excluído
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usuarios/{id}/role:
    patch:
      tags: [Usuarios]
      summary: Promove ou rebaixa o papel de um usuário (admin)
      description: |
        Altera o papel (`role`) de um usuário entre `usuario` e `admin`. Exclusivo para `admin/Sognix`.
        Há trava de segurança: não é possível rebaixar o último administrador ativo (retorna 409).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarRoleInput'
      responses:
        '200':
          description: Papel alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /usuarios/{id}/status:
    patch:
      tags: [Usuarios]
      summary: Ativa ou inativa um usuário (admin)
      description: |
        Define o status do usuário entre `ativo` e `inativo`. Exclusivo para `admin/Sognix`. A exclusão usa `DELETE /usuarios/{id}` (soft delete), não esta via. Não permite inativar o último administrador ativo (retorna 409).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarStatusInput'
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
